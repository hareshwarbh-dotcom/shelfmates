<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shelfmates">
<title>Shelfmates &amp; Me</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HomeBase design system tokens (dark default + light)
   ============================================================ */
:root, [data-theme="dark"] {
  --bg:#121419; --card:#1c1f27; --soft:#262a34; --line:#2c303b;
  --ink:#ecedf0; --on-ink:#121419; --muted:#9a9ea9;
  --accent:#2f6fdb;
  --red:#e8766d; --red-soft:#3a2224; --green:#5dbb7e; --green-soft:#1f3328; --blue:#7fa9d6; --blue-soft:#1f2b3a; --warning:#e8a21c;
  --shadow-float:0 6px 18px rgba(0,0,0,.45);
  color-scheme: dark;
}
[data-theme="light"] {
  --bg:#faf7f2; --card:#ffffff; --soft:#f1eee8; --line:#e8e2d7;
  --ink:#1c1f2a; --on-ink:#ffffff; --muted:#6b6f7a;
  --red:#c8463d; --red-soft:#fbeae8; --green:#3f8f5b; --green-soft:#e7f3eb; --blue:#3c6e9f; --blue-soft:#e6eef6;
  --shadow-float:0 6px 18px rgba(28,31,42,.12);
  color-scheme: light;
}
:root {
  --accent-soft: color-mix(in srgb, var(--accent) 20%, var(--bg));
  --accent-text: color-mix(in srgb, var(--accent) 72%, var(--ink));
  --font-display: Fraunces, Georgia, serif;
  --font-sans: Inter, system-ui, -apple-system, sans-serif;
  --radius-sm:.5rem; --radius-md:.6rem; --radius-lg:.8rem; --radius-sheet:1.1rem; --radius-pill:99px;
}

/* ============================================================
   HomeBase components (from the design system bundle)
   ============================================================ */
html { font-size: 14px; }
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.4; -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: 7rem; }
.hb-header { display: flex; align-items: center; justify-content: space-between; gap: .6rem; padding: calc(.7rem + env(safe-area-inset-top)) 1rem .5rem; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.hb-logo { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; letter-spacing: -.4px; margin: 0; user-select: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-logo span { color: var(--accent); }
.hb-main { padding: 0 1rem; }
.sheet-title { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; margin: .2rem 0 .6rem; }
.section-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 600; margin: 1.1rem 0 .45rem; display: flex; justify-content: space-between; align-items: baseline; }
.sub { color: var(--muted); font-size: .85rem; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: .6rem .8rem; margin-bottom: .5rem; }
.row { display: flex; align-items: center; gap: .6rem; }
.grow { flex: 1; min-width: 0; }
.item-title { font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: .82rem; color: var(--muted); margin-top: 1px; display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
.src { font-size: 1.1rem; width: 1.8rem; text-align: center; flex-shrink: 0; }
.empty { text-align: center; color: var(--muted); padding: 1.4rem .6rem; font-size: .88rem; line-height: 1.5; }

.pill { font-size: .7rem; font-weight: 600; padding: .08rem .45rem; border-radius: var(--radius-pill); white-space: nowrap; }
.pill.ok { background: var(--green-soft); color: var(--green); }
.pill.info { background: var(--blue-soft); color: var(--blue); }
.pill.soon { background: var(--accent-soft); color: var(--accent-text); }
.pill.late { background: var(--red-soft); color: var(--red); }
.pill.later { background: var(--soft); color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius-md); padding: .4rem .8rem; min-height: 2.3rem; font-size: .88rem; font-weight: 500; cursor: pointer; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: .35rem; }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.danger { color: var(--red); }
.btn.block { width: 100%; min-height: 2.8rem; }
.btn:disabled { opacity: .45; cursor: default; }
.actions { display: flex; gap: .4rem; margin-top: .6rem; flex-wrap: wrap; }
.formbtns { display: flex; gap: .5rem; margin-top: 1.1rem; }
.formbtns .btn { flex: 1; min-height: 2.7rem; }
.iconbtn { background: none; border: 1px solid var(--line); border-radius: var(--radius-md); width: 2.4rem; height: 2.4rem; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; color: var(--ink); position: relative; display: inline-flex; align-items: center; justify-content: center; }
.iconbtn::after { content: ''; position: absolute; inset: -4px; }
.syncdot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.syncdot.pending { background: var(--warning); } .syncdot.error { background: var(--red); }
.link { background: none; border: none; color: var(--accent-text); font-weight: 600; font-size: .88rem; padding: .6rem .2rem; cursor: pointer; }

.chips { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: 2px; margin-bottom: .6rem; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius-pill); padding: .35rem .85rem; min-height: 2.2rem; font-size: .88rem; cursor: pointer; white-space: nowrap; color: var(--ink); }
.chip.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chip.sm { min-height: 1.9rem; padding: .2rem .65rem; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: .6rem .75rem; }
.stat .n { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; }
.stat .l { font-size: .76rem; color: var(--muted); line-height: 1.25; }
.stat.hl { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.stat.hl .l { color: var(--on-ink); opacity: .72; }

.hb-label { display: block; font-size: .82rem; font-weight: 600; margin: .7rem 0 .3rem; }
.hb-input { width: 100%; min-width: 0; min-height: 2.6rem; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius-md); padding: .5rem .7rem; font-size: max(16px, 1rem); color: var(--ink); }
.hb-input:focus { outline: none; border-color: var(--accent); }
textarea.hb-input { resize: none; line-height: 1.5; }

.mgroup { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; margin-top: .7rem; }
.mrow { display: flex; align-items: center; gap: .7rem; width: 100%; min-height: 3rem; padding: .55rem .85rem; background: none; border: none; border-bottom: 1px solid var(--line); color: var(--ink); text-align: left; cursor: pointer; }
.mgroup .mrow:last-child { border-bottom: none; }
.mrow .mi { font-size: 1.1rem; width: 1.5rem; text-align: center; flex-shrink: 0; }
.mrow .mt { flex: 1; font-weight: 500; min-width: 0; }
.mrow .mt small { display: block; font-weight: 400; font-size: .78rem; color: var(--muted); margin-top: 1px; }
.mrow .ms { color: var(--muted); font-size: .82rem; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .mc { color: var(--muted); font-size: 1.1rem; }
.mrow.danger .mt { color: var(--red); } .mrow.danger .mc { display: none; }
.mrow.static { cursor: default; }

.switch { position: relative; display: inline-block; width: 2.6rem; height: 1.5rem; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--soft); border: 1px solid var(--line); border-radius: var(--radius-pill); transition: .2s; cursor: pointer; }
.switch span::before { content: ''; position: absolute; width: 1.1rem; height: 1.1rem; left: .15rem; top: 50%; transform: translateY(-50%); background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + span { background: var(--green); border-color: var(--green); }
.switch input:checked + span::before { transform: translate(1.1rem, -50%); }

.swatches { display: flex; gap: .7rem; flex-wrap: wrap; }
.swatch { width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; position: relative; }
.swatch::after { content: ''; position: absolute; inset: -5px; }
.swatch.on { box-shadow: 0 0 0 2px var(--ink); }

.banner { display: flex; gap: .6rem; align-items: flex-start; border-radius: var(--radius-lg); padding: .6rem .8rem; border: 1px solid var(--line); margin: .6rem 0; }
.banner.accent { background: var(--accent-soft); }
.banner.info { background: var(--blue-soft); }
.banner .b-icon { font-size: 1.3rem; }

.overlay { position: fixed; inset: 0; background: rgba(10,12,18,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.overlay.anim { animation: fade .2s ease-out; }
.overlay.anim .sheet { animation: up .24s cubic-bezier(.2,.8,.2,1); }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; padding: 1.1rem 1rem calc(1.6rem + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; }
.sheet.tall { min-height: 80vh; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
@keyframes fade { from { background: rgba(10,12,18,0); } }

.toast { background: var(--ink); color: var(--on-ink); padding: .4rem .4rem .4rem .9rem; border-radius: var(--radius-md); font-size: .88rem; display: inline-flex; align-items: center; gap: .5rem; max-width: calc(100vw - 32px); box-shadow: var(--shadow-float); min-height: 2.6rem; }
.toast.fixed { position: fixed; bottom: calc(8rem + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 30; transition: opacity .2s; }
.toast.hide { opacity: 0; pointer-events: none; }
.toast button { background: none; border: none; color: var(--accent); filter: brightness(1.3); font-weight: 700; cursor: pointer; padding: 0 .7rem; min-height: 2.4rem; text-transform: uppercase; letter-spacing: .5px; }
[data-theme="light"] .toast button { filter: brightness(1.6); }

.hb-nav { background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
.hb-nav.fixed { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; }
.hb-nav .inner { display: flex; max-width: 560px; width: 100%; }
.hb-nav button { flex: 1; min-width: 0; min-height: 3.3rem; background: none; border: none; padding: .4rem 0 .5rem; font-size: .7rem; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.hb-nav button .ic { font-size: 1.2rem; filter: grayscale(1); opacity: .55; }
.hb-nav button.on { color: var(--ink); font-weight: 600; }
.hb-nav button.on .ic { filter: none; opacity: 1; }
.fab { width: 3.2rem; height: 3.2rem; border-radius: 50%; background: var(--accent); color: #fff; font-size: 1.6rem; border: none; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent); cursor: pointer; }
.fab.fixed { position: fixed; bottom: calc(4.2rem + env(safe-area-inset-bottom)); right: max(1rem, calc(50% - 264px)); z-index: 11; }

html.comfy .card { padding: .85rem 1rem; margin-bottom: .7rem; }
html.comfy .btn, html.comfy .chip { min-height: 2.75rem; }

/* ============================================================
   Shelfmates additions, built from the same tokens
   ============================================================ */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* covers */
.cover { border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--font-display); font-weight: 700; overflow: hidden; object-fit: cover; background: #2C3E50; }
.fcover { display: block; position: relative; width: 100%; aspect-ratio: 2/3; border-radius: 6px; overflow: hidden; background: #2C3E50; border: 1px solid var(--line); }
.fcover img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }
.fcover .gen { position: absolute; inset: 0; padding: .6rem .55rem; display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
.fcover .gen b { font-family: var(--font-display); font-size: .95rem; line-height: 1.15; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.fcover .gen i { font-style: normal; font-size: .66rem; opacity: .85; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cover-wrap { position: relative; flex-shrink: 0; display: block; cursor: pointer; }
.cam { position: absolute; right: -6px; bottom: -6px; width: 1.9rem; height: 1.9rem; border-radius: 50%; background: var(--card); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: .85rem; }

/* today: book stack + week shelf */
.today-row { display: flex; align-items: flex-end; gap: 1rem; margin: .4rem 0 .8rem; }
.today-num { display: flex; flex-direction: column; padding-bottom: .4rem; min-width: 0; }
.today-num .dnum { font-family: var(--font-display); font-size: 3.6rem; font-weight: 700; line-height: 1; letter-spacing: -1.5px; }
.today-num .lbl { font-size: .95rem; color: var(--muted); }
.today-num .goal { font-size: .82rem; color: var(--muted); margin-top: .5rem; }
.sbook { animation: drop .35s cubic-bezier(.2,.8,.2,1) both; }
@keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
.wshelf { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .4rem; align-items: end; height: 7rem; border-bottom: 4px solid var(--line); border-radius: 0 0 2px 2px; padding: 0 .3rem; }
.wshelf div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; position: relative; }
.wshelf i { display: block; width: 62%; max-width: 20px; border-radius: 3px 3px 0 0; }
.wshelf i.none { height: 18px; border: 1px dashed var(--line); border-bottom: none; background: none; }
.wshelf em { font-style: normal; font-size: .66rem; color: var(--muted); }
.wshelf span { position: absolute; bottom: -1.5rem; font-size: .72rem; color: var(--muted); }
.wshelf .on span { color: var(--ink); font-weight: 700; }
.today-card .wshelf { margin-bottom: 1.6rem; }
/* today card (book-first) */
.tslides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 1rem; margin-top: .6rem; scrollbar-width: none; }
.tslides::-webkit-scrollbar { display: none; }
.tslide { flex: 0 0 100%; scroll-snap-align: start; display: flex; gap: .9rem; align-items: center; }
.tcover { all: unset; cursor: pointer; width: 4.8rem; flex-shrink: 0; position: relative; display: block; }
.tcover .ribbon { position: absolute; top: -4px; right: .7rem; width: .7rem; height: 1.9rem; background: #FFC83D; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%); }
.tpager { display: flex; justify-content: center; gap: 5px; margin-top: .5rem; }
.tpager i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.tpager i.on { background: var(--muted); }
.tweek { display: flex; justify-content: space-between; margin-top: .9rem; padding: 0 .3rem; }
.tday { display: flex; flex-direction: column; align-items: center; gap: .3rem; font-size: .72rem; color: var(--muted); }
.tday i { width: .6rem; height: .6rem; border-radius: 50%; border: 1px solid var(--line); }
.tday i.read { background: var(--accent); border-color: var(--accent); }
.tday.on { color: var(--ink); font-weight: 700; }
.tday.on i { box-shadow: 0 0 0 3px var(--accent-soft); }
/* celebrations */
.cele { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(10,12,18,.45); animation: fade .2s ease-out; padding: 1.5rem; }
.cele-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sheet); padding: 1.4rem 1.2rem 1.1rem; max-width: 22rem; width: 100%; text-align: center; animation: pop .35s cubic-bezier(.2,1.4,.4,1); position: relative; z-index: 2; }
.cele-card .big { font-size: 2.6rem; line-height: 1; }
.cele-card h2 { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; margin: .5rem 0 .3rem; }
.cele-card p { margin: 0; color: var(--muted); line-height: 1.5; }
.cele-card .ccover { width: 4.6rem; margin: .7rem auto 0; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; animation: fall 1.6s ease-in forwards; }
@keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .8; } }
/* today dial */
.today-card { padding: .9rem .8rem .8rem; }
.dial { position: relative; width: 15rem; height: 13.6rem; margin: .4rem auto 0; }
.dial > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.dial .mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: .3rem; }
.dial .dnum { font-family: var(--font-display); font-size: 4.4rem; font-weight: 700; line-height: 1; letter-spacing: -2px; }
.dial .lbl { font-size: .95rem; color: var(--muted); margin-top: .2rem; }
.dial .goal { font-size: .85rem; color: var(--muted); margin-top: .35rem; }
.dial .dbtn { position: absolute; bottom: 0; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .5rem; align-items: end; height: 6.4rem; padding: .6rem .3rem 0; border-top: 1px solid var(--line); margin-top: .7rem; }
.week div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%; }
.week i { display: block; width: 55%; max-width: 16px; border-radius: 4px 4px 2px 2px; background: var(--soft); min-height: 3px; }
.week .has i { background: color-mix(in srgb, var(--accent) 55%, var(--soft)); }
.week .on i { background: var(--accent); }
.week span { font-size: .72rem; color: var(--muted); }
.week .on span { color: var(--ink); font-weight: 600; }
.week em { font-style: normal; font-size: .66rem; color: var(--muted); height: .9rem; }

/* clubs */
.club-badge { width: 2.6rem; height: 2.6rem; border-radius: var(--radius-md); background: var(--accent-soft); color: var(--accent-text); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; flex-shrink: 0; }
.minicovers { display: flex; gap: 3px; margin-top: .35rem; }
.minicovers .cover { width: 1.3rem; height: 1.9rem; font-size: .6rem; border-radius: 2px; }
.av { width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--soft); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: .85rem; flex-shrink: 0; border: 1px solid var(--line); }
.av.me { background: var(--accent-soft); color: var(--accent-text); }
.av.sm { width: 1.5rem; height: 1.5rem; font-size: .68rem; }
.code { font-family: var(--font-display); font-size: 2rem; font-weight: 700; letter-spacing: .35rem; text-align: center; padding: .6rem 0; }

/* shelf */
.now { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr); gap: .8rem; align-items: start; }
.shelf { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem .6rem; }
.shelf-item { display: flex; flex-direction: column; gap: .3rem; border: none; background: none; padding: 0; text-align: left; min-width: 0; cursor: pointer; color: var(--ink); }
.shelf-item .item-title { font-size: .85rem; }
.shelf-item .meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

/* progress */
.prog { display: flex; flex-direction: column; gap: 1px; margin-top: .4rem; }
.prog-row { display: flex; align-items: center; gap: .55rem; }
.slider { flex: 1; min-width: 0; -webkit-appearance: none; appearance: none; height: 2rem; background: transparent; margin: 0; --p: 0%; }
.slider:focus { outline: none; }
.slider::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--accent) var(--p), var(--soft) var(--p)); }

<body>
<div class="app" id="app"></div>
<div id="sheet-root"></div>
<div id="cele-root"></div>
<div class="toast fixed hide" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   Shelfmates & Me
   Read at your own pace. Discover through others. Share what stays with you.
   Built on the HomeBase design system.
   ============================================================ */

/* ---------- Supabase config ---------- */
const SUPABASE_URL = 'https://cyrctzuzumeunoyysqsl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_VCJYEhIWT_dDg_THeeZmuw_qm0Gt-Nu';
const CLOUD = !!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase);

const APP = { first: 'Shelfmates', second: '& Me' };
const STORE_KEY = 'bookclub.v1';
let ME = 'me';
let sb = null, authUser = null, isAdmin = false;
let pendingJoin = new URLSearchParams(location.search).get('join');
let syncState = 'ok';   // ok | pending | error

/* ---------- display settings (per device) ---------- */
const ACCENTS = { blue: '#2f6fdb', saffron: '#e8891c', teal: '#1f8a84', indigo: '#5b5bd6', rose: '#d14b72', green: '#3f8f5b' };
const SIZES = { small: 13, default: 14, large: 15.5, xl: 17 };
const DISPLAY_DEFAULT = { theme: 'dark', accent: 'blue', size: 'default', comfy: false };
let display = (() => { try { return Object.assign({}, DISPLAY_DEFAULT, JSON.parse(localStorage.getItem('sm.display') || '{}')); } catch (e) { return { ...DISPLAY_DEFAULT }; } })();
const mq = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
function applyDisplay() {
  const root = document.documentElement;
  const theme = display.theme === 'auto' ? (mq && mq.matches ? 'light' : 'dark') : display.theme;
  root.dataset.theme = theme;
  root.style.setProperty('--accent', ACCENTS[display.accent] || ACCENTS.blue);
  root.style.fontSize = (SIZES[display.size] || 14) + 'px';
  root.classList.toggle('comfy', !!display.comfy);
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.content = theme === 'light' ? '#faf7f2' : '#121419';
}
function setDisplay(patch) { Object.assign(display, patch); try { localStorage.setItem('sm.display', JSON.stringify(display)); } catch (e) {} applyDisplay(); }
if (mq && mq.addEventListener) mq.addEventListener('change', () => { if (display.theme === 'auto') applyDisplay(); });
applyDisplay();

/* ---------- helpers ---------- */
const COLORS = ['#2F5D62', '#7A4E2D', '#3B4A7A', '#6B3F5E', '#4F6B3A', '#8A5A1F', '#2C3E50', '#5A4FA0'];
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const joinCode = () => Array.from({ length: 6 }, () => 'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random() * 31)]).join('');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const colorFor = t => { let h = 0; for (const ch of String(t)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const pct = b => b.pages ? Math.min(100, Math.round(b.page / b.pages * 100)) : Math.min(100, b.percent || 0);
const tracked = b => b.track ?? (b.page > 0 || !!b.percent);
const progMax = b => b.pages || 100;
const progVal = b => b.pages ? b.page : (b.percent || 0);
const progLabel = b => b.pages ? `Page ${b.page} of ${b.pages} · ${pct(b)}%` : `${pct(b)}% read`;
const norm = t => String(t || '').trim().toLowerCase();
const initial = n => esc(String(n || '?').trim().charAt(0).toUpperCase());
const timeAgo = ts => {
  const d = Math.floor((Date.now() - ts) / 86400000);
  if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 7) return d + ' days ago';
  return new Date(ts).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
};
const REACT = {
  up: { emoji: '👍', label: 'Liked it', pill: 'ok' },
  mid: { emoji: '😐', label: 'It was okay', pill: 'later' },
  down: { emoji: '👎', label: "Didn't like it", pill: 'late' }
};

/* ---------- private reading log: pages read per book per day ---------- */
const dayStr = d => { const x = new Date(d || Date.now()); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
function logPages(b, delta) {
  if (!db || !delta || !b || b.userId !== ME) return;
  db.log = db.log || [];
  const day = dayStr();
  let e = db.log.find(l => l.bookId === b.id && l.day === day);
  if (!e) { if (delta < 0) return; e = { id: uid(), bookId: b.id, title: b.title, day, pages: 0 }; db.log.push(e); }
  e.pages = Math.max(0, e.pages + delta); e.updatedAt = Date.now();
}
const pagesOn = day => (db.log || []).filter(l => l.day === day).reduce((n, l) => n + l.pages, 0);
function progControl(b, pre) {
  const v = progVal(b), max = progMax(b);
  return `<div class="prog">
    <div class="prog-row">
      <label class="sr" for="${pre}r-${b.id}">Reading progress</label>
      <input class="slider" id="${pre}r-${b.id}" type="range" min="0" max="${max}" step="1" value="${v}" data-prog-range="${b.id}" style="--p:${pct(b)}%">
      <label class="sr" for="${pre}n-${b.id}">${b.pages ? 'Page number' : 'Percent read'}</label>
      <input class="num" id="${pre}n-${b.id}" type="number" inputmode="numeric" min="0" max="${max}" value="${v}" data-prog-num="${b.id}">
      <span class="unit">${b.pages ? '/ ' + b.pages : '%'}</span>
    </div>
    <div class="small" data-prog-label="${b.id}">${progLabel(b)}</div>
  </div>`;
}


/* ---------- data ---------- */
const cacheKey = () => CLOUD ? STORE_KEY + ':' + ME : STORE_KEY;
let db = CLOUD ? null : load();
function load() {
  try { const raw = localStorage.getItem(cacheKey()); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function save() {
  let ok = true;
  try { localStorage.setItem(cacheKey(), JSON.stringify(db)); }
  catch (e) { if (!CLOUD) { toast('Phone storage is full. Try a smaller photo or remove some photos.'); ok = false; } }
  if (CLOUD && db) { setSyncState('pending'); queueSync(); }
  return ok;
}

/* ============================================================
   Cloud sync (Supabase)
   - Every visitor gets an anonymous account automatically.
   - Adding an email (Settings) is optional.
   - Only your own rows are written; sample (demo) data stays on the device.
   ============================================================ */
let synced = {};            // 'b:<id>' -> JSON of what Supabase has
let syncTimer, syncing = false, syncAgain = false, syncErrShown = false;
const iso = ts => new Date(ts || Date.now()).toISOString();
const bookRow = b => ({ id: b.id, user_id: ME, title: b.title, author: b.author || '', pages: b.pages || 0, page: b.page || 0, percent: b.percent || 0, track: !!tracked(b), status: b.status, cover_url: b.coverUrl || '', photo_url: b.photo || '', from_note: b.from || '', updated_at: iso(b.updatedAt) });
const postRow = p => ({ id: p.id, user_id: ME, title: p.title, author: p.author || '', pages: p.pages || 0, cover_url: p.coverUrl || '', reaction: p.reaction, text: p.text || '', photo_url: p.photo || '', created_at: iso(p.createdAt) });
const groupRow = g => ({ id: g.id, name: g.name, code: g.code, created_by: ME, created_at: iso(g.createdAt) });
const profileRow = () => ({ id: ME, name: db.me.name, show_progress: db.me.showProgress !== false, theme: db.me.theme || 'teal', daily_goal: db.me.goal || null, show_clubs: !!db.me.showClubs });
const logRow = l => ({ id: l.id, user_id: ME, book_id: l.bookId, title: l.title, day: l.day, pages: l.pages, updated_at: iso(l.updatedAt) });
const rowToBook = r => ({ id: r.id, userId: r.user_id, title: r.title, author: r.author || '', pages: r.pages || 0, page: r.page || 0, percent: r.percent || 0, track: r.track, status: r.status, coverUrl: r.cover_url || '', photo: r.photo_url || '', from: r.from_note || '', updatedAt: Date.parse(r.updated_at) || Date.now() });
const rowToPost = r => ({ id: r.id, userId: r.user_id, title: r.title, author: r.author || '', pages: r.pages || 0, coverUrl: r.cover_url || '', reaction: r.reaction, text: r.text || '', photo: r.photo_url || '', createdAt: Date.parse(r.created_at) || Date.now() });

function queueSync() { clearTimeout(syncTimer); syncTimer = setTimeout(sync, 500); }

async function uploadPhoto(dataUrl) {
  const blob = await (await fetch(dataUrl)).blob();
  const path = `${ME}/${uid()}.jpg`;
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
  if (error) throw error;
  return sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
}

async function sync() {
  if (!CLOUD || !db || !authUser) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  setSyncState('pending');
  try {
    // profile
    const pr = profileRow(), prJ = JSON.stringify(pr);
    if (synced['p:me'] !== prJ) { const { error } = await sb.from('profiles').upsert(pr); if (error) throw error; synced['p:me'] = prJ; }

    // groups I created (+ my membership)
    for (const g of db.groups.filter(g => !g.demo && (g.createdBy || ME) === ME)) {
      const row = groupRow(g), j = JSON.stringify(row);
      if (synced['g:' + g.id] === j) continue;
      const isNew = !synced['g:' + g.id];
      const { error } = isNew ? await sb.from('groups').insert(row) : await sb.from('groups').update({ name: g.name }).eq('id', g.id);
      if (error) throw error;
      if (isNew) { const r = await sb.from('group_members').insert({ group_id: g.id, user_id: ME }); if (r.error && r.error.code !== '23505') throw r.error; }
      synced['g:' + g.id] = j;
    }

    // my books (upload any new photos first)
    const mine = db.books.filter(b => b.userId === ME && !b.demo);
    for (const b of mine) {
      if (b.photo && b.photo.startsWith('data:')) { b.photo = await uploadPhoto(b.photo); localStorage.setItem(cacheKey(), JSON.stringify(db)); }
      const row = bookRow(b), j = JSON.stringify(row);
      if (synced['b:' + b.id] === j) continue;
      const { error } = await sb.from('books').upsert(row); if (error) throw error;
      synced['b:' + b.id] = j;
    }
    const bookIds = new Set(mine.map(b => b.id));
    for (const k of Object.keys(synced).filter(k => k.startsWith('b:') && !bookIds.has(k.slice(2)))) {
      const { error } = await sb.from('books').delete().eq('id', k.slice(2)); if (error) throw error;
      delete synced[k];
    }

    // my private reading log (only books still in the cloud)
    for (const l of (db.log || [])) {
      if (!synced['b:' + l.bookId] && !db.books.some(b => b.id === l.bookId && b.userId === ME && !b.demo)) continue;
      if (!synced['b:' + l.bookId]) continue;
      const row = logRow(l), j = JSON.stringify(row);
      if (synced['l:' + l.id] === j) continue;
      const { error } = await sb.from('reading_log').upsert(row, { onConflict: 'user_id,book_id,day' }); if (error) throw error;
      synced['l:' + l.id] = j;
    }

    // my posts
    const myPosts = db.posts.filter(p => p.userId === ME && !p.demo);
    for (const p of myPosts) {
      if (p.photo && p.photo.startsWith('data:')) p.photo = await uploadPhoto(p.photo);
      if (p.coverUrl && p.coverUrl.startsWith('data:')) {
        const b = db.books.find(x => x.userId === ME && norm(x.title) === norm(p.title) && x.photo && !x.photo.startsWith('data:'));
        p.coverUrl = b ? b.photo : await uploadPhoto(p.coverUrl);
      }
      const row = postRow(p), j = JSON.stringify(row);
      if (synced['o:' + p.id] === j) continue;
      const { error } = await sb.from('posts').upsert(row); if (error) throw error;
      synced['o:' + p.id] = j;
    }
    const postIds = new Set(myPosts.map(p => p.id));
    for (const k of Object.keys(synced).filter(k => k.startsWith('o:') && !postIds.has(k.slice(2)))) {
      const { error } = await sb.from('posts').delete().eq('id', k.slice(2)); if (error) throw error;
      delete synced[k];
    }
    localStorage.setItem(cacheKey(), JSON.stringify(db));
    syncErrShown = false;
    setSyncState('ok');
  } catch (e) {
    console.error('Sync failed', e);
    setSyncState('error');
    if (!syncErrShown) { toast("Couldn't save to the cloud: " + ((e && e.message) || e)); syncErrShown = true; }
    clearTimeout(syncTimer); syncTimer = setTimeout(sync, 15000);
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; queueSync(); }
  }
}

/* pull everything visible to me from Supabase and rebuild db (keeps sample data) */
async function pull() {
  const { data: prof, error: pe } = await sb.from('profiles').select('*').eq('id', ME).maybeSingle();
  if (pe) throw pe;
  if (!prof) { db = null; return; }
  const mem = await sb.from('group_members').select('group_id').eq('user_id', ME);
  if (mem.error) throw mem.error;
  const gids = mem.data.map(r => r.group_id);
  let groups = [], members = [];
  if (gids.length) {
    const [g, m] = await Promise.all([
      sb.from('groups').select('*').in('id', gids),
      sb.from('group_members').select('group_id,user_id').in('group_id', gids)
    ]);
    if (g.error) throw g.error; if (m.error) throw m.error;
    groups = g.data; members = m.data;
  }
  const userIds = [...new Set([ME, ...members.map(m => m.user_id)])];
  const since = dayStr(Date.now() - 400 * 86400000);
  const [profs, books, posts, admin, log] = await Promise.all([
    sb.from('profiles').select('id,name,show_progress').in('id', userIds),
    sb.from('books').select('*').in('user_id', userIds),
    sb.from('posts').select('*').in('user_id', userIds).order('created_at', { ascending: false }).limit(300),
    sb.rpc('am_i_admin'),
    sb.from('reading_log').select('*').eq('user_id', ME).gte('day', since)
  ]);
  if (profs.error) throw profs.error; if (books.error) throw books.error; if (posts.error) throw posts.error;
  isAdmin = !!admin.data;

  const prev = db || load();
  const demo = prev ? {
    users: (prev.users || []).filter(u => u.demo),
    groups: (prev.groups || []).filter(g => g.demo).map(g => ({ ...g, members: g.members.map(id => id === 'me' ? ME : id) })),
    books: (prev.books || []).filter(b => b.demo),
    posts: (prev.posts || []).filter(p => p.demo)
  } : { users: [], groups: [], books: [], posts: [] };
  // keep any of my local changes that haven't reached the cloud yet
  const localMine = prev ? (prev.books || []).filter(b => (b.userId === ME) && !b.demo) : [];

  db = {
    version: 3,
    me: { id: ME, name: prof.name, showProgress: prof.show_progress !== false, theme: prof.theme || 'teal', goal: prof.daily_goal || 0, showClubs: !!prof.show_clubs },
    log: (log.data || []).map(r => ({ id: r.id, bookId: r.book_id, title: r.title, day: r.day, pages: r.pages, updatedAt: Date.parse(r.updated_at) || 0 })),
    users: [...profs.data.filter(p => p.id !== ME).map(p => ({ id: p.id, name: p.name, showProgress: p.show_progress !== false })), ...demo.users],
    groups: [...groups.map(g => ({ id: g.id, name: g.name, code: g.code, createdBy: g.created_by, createdAt: Date.parse(g.created_at), members: members.filter(m => m.group_id === g.id).map(m => m.user_id) })), ...demo.groups],
    books: [...books.data.map(rowToBook), ...demo.books],
    posts: [...posts.data.map(rowToPost), ...demo.posts]
  };
  // what the cloud has now
  synced = { 'p:me': JSON.stringify({ id: ME, name: prof.name, show_progress: prof.show_progress !== false, theme: prof.theme || 'teal', daily_goal: prof.daily_goal || null, show_clubs: !!prof.show_clubs }) };
  db.log.forEach(l => synced['l:' + l.id] = JSON.stringify(logRow(l)));
  // keep newer local log entries
  ((prev && prev.log) || []).forEach(ll => {
    const cl = db.log.find(l => l.bookId === ll.bookId && l.day === ll.day);
    if (!cl) db.log.push(ll); else if ((ll.updatedAt || 0) > (cl.updatedAt || 0)) { cl.pages = ll.pages; cl.updatedAt = ll.updatedAt; }
  });
  db.groups.filter(g => !g.demo && g.createdBy === ME).forEach(g => synced['g:' + g.id] = JSON.stringify(groupRow(g)));
  db.books.filter(b => b.userId === ME && !b.demo).forEach(b => synced['b:' + b.id] = JSON.stringify(bookRow(b)));
  db.posts.filter(p => p.userId === ME && !p.demo).forEach(p => synced['o:' + p.id] = JSON.stringify(postRow(p)));
  // re-apply unsynced local edits (newer than the cloud copy)
  localMine.forEach(lb => {
    const cb = db.books.find(b => b.id === lb.id);
    if (!cb) { if (lb.photo && lb.photo.startsWith('data:')) db.books.push(lb); }
    else if ((lb.updatedAt || 0) > (cb.updatedAt || 0)) Object.assign(cb, lb);
  });
  localStorage.setItem(cacheKey(), JSON.stringify(db));
  queueSync();
}

      <div class="chips">${Object.keys(labels).map(k => `<button class="chip ${ui.shelfTab === k ? 'on' : ''}" data-act="shelf" data-id="${k}">${labels[k]} · ${shelves[k].length}</button>`).join('')}</div>
      ${items ? `<div class="shelf">${items}</div>` : `<div class="empty">${hint[ui.shelfTab]}</div>`}` : ''}`;
}

/* ----- Discover ----- */
/* shared pieces for Discover and the club page */
function readingCarousel(others) {
  return db.books.filter(b => others.includes(b.userId) && b.status === 'reading').sort((a, b) => b.updatedAt - a.updatedAt).map(b => {
    const u = userById(b.userId) || { name: 'Member' }, saved = onMyShelf(b.title);
    return `<div class="ccard">
      <button class="who" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:.35rem;font-size:.8rem" data-act="member" data-id="${b.userId}">${avatar(u, 'sm')}<b>${esc(u.name)}</b></button>
      ${fcover(b)}
      ${u.showProgress !== false && tracked(b) ? `<div class="bar"><div style="width:${pct(b)}%"></div></div>` : '<div class="small">Reading</div>'}
      <button class="btn" style="font-size:.78rem" ${saved ? 'disabled' : ''} data-act="save-book" data-id="${b.id}">${saved ? '✓ On my shelf' : '＋ Want to read'}</button>
    </div>`;
  }).join('');
}
function postCard(p) {
  const u = userById(p.userId) || { name: 'Member' }, isMe = p.userId === ME, saved = onMyShelf(p.title);
  return `<article class="card">
    <div class="row"><button style="all:unset;cursor:pointer" data-act="member" data-id="${p.userId}" aria-label="See ${esc(u.name)}'s shelf">${avatar(u)}</button><div class="grow"><div class="item-title">${isMe ? 'You' : esc(u.name)} <span style="font-weight:400;color:var(--muted)">finished a book</span></div><div class="meta">${timeAgo(p.createdAt)}</div></div>
    ${isMe ? `<button class="iconbtn" style="border:none" aria-label="Delete this post" data-act="delete-post" data-id="${p.id}">🗑️</button>` : ''}</div>
    ${p.photo ? `<img class="photo" src="${esc(p.photo)}" alt="Photo shared with ${esc(p.title)}">` : ''}
    ${p.text ? `<p class="thought">${esc(p.text)}</p>` : ''}
    <div class="book-strip">${coverHTML(p, 36, 54)}
      <div class="grow"><div class="item-title" style="font-size:.9rem">${esc(p.title)}</div><div class="meta">${reactionPill(p.reaction)}</div></div>
      ${isMe ? '' : `<button class="btn" style="font-size:.78rem" ${saved ? 'disabled' : ''} data-act="save-post" data-id="${p.id}">${saved ? '✓ Saved' : '＋ Save'}</button>`}
    </div>
  </article>`;
}
function feedHTML(people, emptyOthers) {
  const others = [...people].filter(id => id !== ME);
  const carousel = readingCarousel(others);
  const posts = db.posts.filter(p => people.has(p.userId)).sort((a, b) => b.createdAt - a.createdAt).map(postCard).join('');
  return `<div class="section-label" style="margin-top:.2rem">Reading right now</div>
    ${carousel ? `<div class="carousel">${carousel}</div>` : `<div class="card empty">${others.length ? 'Nobody here is mid-book right now.' : emptyOthers}</div>`}
    <div class="section-label">What stayed with us</div>
    ${posts || '<div class="card empty">When someone finishes a book and shares a thought, it shows up here.</div>'}`;
}
function discoverHTML() {
  const clubs = myClubs();
  if (!clubs.length) return `<div class="card empty" style="margin-top:.5rem">Discover is where you see what your clubs are reading.<br><br>
    <button class="btn accent" data-act="create-open">＋ Create a club</button> ${CLOUD ? '<button class="btn" data-act="w-join">🔑 Join with code</button>' : ''}</div>`;
  const inScope = ui.club === 'all' ? clubs : clubs.filter(g => g.id === ui.club);
  const chips = `<div class="chips"><button class="chip ${ui.club === 'all' ? 'on' : ''}" data-act="club-filter" data-id="all">All clubs</button>${clubs.map(g => `<button class="chip ${ui.club === g.id ? 'on' : ''}" data-act="club-filter" data-id="${g.id}">${esc(g.name)}</button>`).join('')}</div>`;
  return chips + feedHTML(new Set(inScope.flatMap(g => g.members)), "It's just you so far. Open a club on Home and tap Invite.");
}

/* ----- Club page ----- */
function clubPageHTML(g) {
  const t = ui.clubTab || 'books';
  const chips = `<div class="chips">${[['books', '📖 Books'], ['members', `👥 Members · ${g.members.length}`], ['about', 'ℹ️ About']].map(([k, l]) => `<button class="chip ${t === k ? 'on' : ''}" data-act="club-tab" data-id="${k}">${l}</button>`).join('')}</div>`;
  let body = '';
  if (t === 'books') body = feedHTML(new Set(g.members), g.demo ? '' : 'Just you so far. Tap <b>Invite</b> at the top to bring people in.');
  if (t === 'members') {
    const ids = [ME, ...g.members.filter(id => id !== ME)].filter(id => g.members.includes(id));
    body = `<div class="mgroup" style="margin-top:.2rem">${ids.map(id => {
      const u = userById(id) || { id, name: 'Member' };
      const now = db.books.filter(b => b.userId === id && b.status === 'reading');
      const done = db.books.filter(b => b.userId === id && b.status === 'finished').length;
      return `<button class="mrow" data-act="member" data-id="${id}">${avatar(u)}<span class="mt">${esc(u.name)}${id === ME ? ' (you)' : ''}${id === g.createdBy ? ' <span class="pill info">Started the club</span>' : ''}
        <small>${now.length ? '📖 ' + now.map(b => esc(b.title)).join(', ') : 'Not reading anything right now'}${done ? ` · ${done} finished` : ''}</small></span><span class="mc">›</span></button>`;
    }).join('')}</div>
    ${g.demo ? '' : '<button class="btn block" style="margin-top:.7rem" data-act="invite" data-id="' + g.id + '">💌 Invite people</button>'}`;
  }
  if (t === 'about') {
    const by = userById(g.createdBy);
    body = `<div class="mgroup" style="margin-top:.2rem">
        <div class="mrow static"><span class="mi">📅</span><span class="mt">Started<small>${g.createdAt ? new Date(g.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' }) : '—'}${by ? ' by ' + esc(by.id === ME ? 'you' : by.name) : ''}</small></span></div>
        <div class="mrow static"><span class="mi">👥</span><span class="mt">${g.members.length} ${g.members.length === 1 ? 'member' : 'members'}<small>Everyone reads their own books, at their own pace.</small></span></div>
        ${g.demo ? '<div class="mrow static"><span class="mi">🧪</span><span class="mt">Sample club<small>Pretend people so you can see how it works.</small></span></div>' : ''}
      </div>
      ${!g.demo && CLOUD ? `<div class="mgroup"><button class="mrow danger" data-act="leave-club" data-id="${g.id}"><span class="mi">🚪</span><span class="mt">Leave club</span></button></div>` : ''}`;
  }
  return chips + body;
}

/* ----- Share ----- */
function shareHTML() {
  const s = ui.share;
  const options = myBooks().filter(b => b.status === 'reading' || b.status === 'finished').sort((a, b) => b.updatedAt - a.updatedAt);
  if (s.bookId && !options.find(b => b.id === s.bookId)) s.bookId = null;
  const canPost = s.bookId && s.reaction;
  return `<p class="sub" style="margin:.2rem 0 .4rem">A line, a quote, a learning. It helps someone find their next book.</p>
    <div class="section-label">1 · The book</div>
    ${options.length ? `<div class="pick-row">${options.map(b => `<button class="pick ${s.bookId === b.id ? 'on' : ''}" aria-pressed="${s.bookId === b.id}" data-act="share-book" data-id="${b.id}">${fcover(b)}<span class="small">${esc(b.title)}</span></button>`).join('')}</div>`
      : `<div class="card empty">Add a book to your shelf first.<br><br><button class="btn accent" data-act="add-open">＋ Add a book</button></div>`}
    <div class="section-label">2 · How was it?</div>
    <div class="reacts">${['up', 'mid', 'down'].map(k => `<button class="react ${s.reaction === k ? 'on' : ''}" aria-pressed="${s.reaction === k}" data-act="react" data-id="${k}"><b>${REACT[k].emoji}</b>${REACT[k].label}</button>`).join('')}</div>
    <div class="section-label"><label for="thought">3 · What stayed with you? <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label></div>
    <textarea class="hb-input" id="thought" rows="4" maxlength="1000" placeholder="One line is enough">${esc(s.text)}</textarea>
    <div style="margin-top:.5rem">${s.photo ? `<img class="photo" src="${esc(s.photo)}" alt="Your photo to share"><button class="btn" data-act="share-photo-remove">Remove photo</button>`
      : `<label class="drop"><input class="file" type="file" accept="image/*" data-share-photo="1"><span style="font-size:1.4rem">📷</span><span>Add a photo<small>The cover, a page you loved, your reading spot</small></span></label>`}</div>
    <button class="btn primary block" style="margin-top:1rem" data-act="post" ${canPost ? '' : 'disabled'}>${canPost ? 'Share with my clubs' : 'Pick a book and how it was'}</button>
    <p class="sub" style="text-align:center">Shows in every club you're in.</p>`;
}

/* ---------- add-book results ---------- */
function suggestions() {
  const people = new Set(myClubs().flatMap(g => g.members).filter(id => id !== ME));
  const seen = new Set(), out = [];
  const push = (x, who) => { if (seen.has(norm(x.title)) || onMyShelf(x.title)) return; seen.add(norm(x.title)); out.push({ title: x.title, author: x.author, pages: x.pages, coverUrl: x.coverUrl, from: 'Saved from ' + who }); };
  db.books.filter(b => people.has(b.userId) && b.status === 'reading').forEach(b => push(b, userById(b.userId)?.name || 'a friend'));
  db.posts.filter(p => people.has(p.userId) && p.reaction !== 'down').forEach(p => push(p, userById(p.userId)?.name || 'a friend'));
  return out.slice(0, 6);
}
function resultRow(r, i, src) {
  const inS = onMyShelf(r.title);
  return `<div class="result">${coverHTML(r, 36, 54)}
    <div class="grow"><div class="item-title clamp2">${esc(r.title)}</div><div class="meta">${esc(r.author || 'Unknown author')}${r.pages ? ' · ' + r.pages + ' pages' : ''}</div></div>
    ${inS ? '<span class="pill ok">On shelf</span>' : `<div class="row" style="gap:.3rem">
      <button class="btn" data-act="add-result" data-src="${src}" data-id="${i}" data-status="want" aria-label="Want to read ${esc(r.title)}">Want</button>
      <button class="btn primary" data-act="add-result" data-src="${src}" data-id="${i}" data-status="reading" aria-label="Start reading ${esc(r.title)}">Start</button></div>`}
  </div>`;
}
function resultsHTML() {
  const s = ui.search;
  if (!s.q) {
    const sug = suggestions(); ui.sheetData.suggest = sug;
    return sug.length ? `<div class="section-label">Picks from your clubs</div>${sug.map((r, i) => resultRow(r, i, 'suggest')).join('')}` : '<div class="empty">Search millions of books by title or author.</div>';
  }
  if (s.loading) return Array.from({ length: 4 }, () => `<div class="result"><span class="skel" style="width:2.6rem;height:3.9rem"></span><div class="grow"><div class="skel" style="height:.8rem;width:70%"></div><div class="skel" style="height:.7rem;width:45%;margin-top:.4rem"></div></div></div>`).join('');
  if (s.error) return `<div class="empty">${esc(s.error)}</div>`;
  return s.results.map((r, i) => resultRow(r, i, 'search')).join('');
}

function readPhoto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const max = 900, scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- book search (Open Library) ---------- */
let searchTimer, searchSeq = 0;
function queueSearch(q) {
  clearTimeout(searchTimer);
  ui.search.q = q;
  if (q.length < 2) { ui.search = { q, loading: false, results: [], error: '' }; renderResults(); return; }
  ui.search.loading = true; ui.search.error = ''; renderResults();
  searchTimer = setTimeout(() => searchBooks(q), 400);
}
async function searchBooks(q) {
  const seq = ++searchSeq;
  try {
    const url = 'https://openlibrary.org/search.json?limit=15&fields=title,author_name,number_of_pages_median,cover_i&q=' + encodeURIComponent(q);
    const res = await fetch(url);
    if (!res.ok) throw new Error('bad');
    const data = await res.json();
    if (seq !== searchSeq) return;
    ui.search.results = (data.docs || []).map(d => ({
      title: d.title,
      author: (d.author_name || []).slice(0, 2).join(', '),
      pages: d.number_of_pages_median || 0,
      coverUrl: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : ''
    }));
    ui.search.error = ui.search.results.length ? '' : 'No matches. Try fewer words, or add it yourself.';
  } catch (e) {
    if (seq !== searchSeq) return;
    ui.search.error = "Couldn't reach the book search. Check your connection, or add it yourself.";
  }
  ui.search.loading = false;
  if (ui.sheet === 'add') renderResults();
}

function addBook({ title, author = '', pages = 0, coverUrl = '', photo = '', status = 'want', from = '' }) {
  if (onMyShelf(title)) { toast('Already on your shelf'); return null; }
  const b = { id: uid(), userId: ME, title: title.trim(), author, pages: +pages || 0, page: 0, percent: 0, track: false, status, coverUrl, photo, from, updatedAt: Date.now() };
  db.books.push(b); save();
  return b;
}
function updBook(id, patch) {
  const b = db.books.find(x => x.id === id); if (!b) return;
  Object.assign(b, patch, { updatedAt: Date.now() }); save();
}
function saveFromOther(x, userId) {
  const u = userById(userId);
  if (addBook({ title: x.title, author: x.author, pages: x.pages, coverUrl: x.coverUrl, status: 'want', from: 'Saved from ' + (u?.name || 'a friend') })) {
    ui.shelfTab = 'want'; render(); wantToast(x.title);
  }
}

    if (!name) { toast('Add your name'); return; }
    if (!/^\S+@\S+\.\S+$/.test(email)) { toast('Enter a valid email'); return; }
    if (password.length < 6) { toast('Password needs at least 6 characters'); return; }
    ui.sheet = null; startApp(name); await finishOnboard();
    await createAccount(email, password);
  },
  async 'w-join-save'() {
    const code = document.getElementById('wj-code').value.trim().toLowerCase();
    if (!code) { toast('Type the club code'); return; }
    if (!db) {
      const name = document.getElementById('wj-name').value.trim();
      if (!name) { toast('Add your name'); return; }
      pendingJoin = code; ui.sheet = null; startApp(name); await finishOnboard();
    } else { ui.sheet = null; render(); await joinByCode(code); }
  },
  tab(id) { ui.tab = id; ui.clubPage = null; render(); scrollTo(0, 0); },
  shelf(id) { ui.shelfTab = id; render(); },
  'club-filter'(id) { ui.club = id; render(); },
  settings(id) { openSheet('settings', { page: id || '' }); },
  'set-page'(id) { ui.sheetData = { page: id || '' }; renderSheet(); },
  'acc-mode'() { ui.sheetData.signin = !ui.sheetData.signin; renderSheet(); },
  async 'acc-create'() {
    const email = document.getElementById('acc-email').value.trim(), password = document.getElementById('acc-pw').value;
    if (!/^\S+@\S+\.\S+$/.test(email)) { toast('Enter a valid email'); return; }
    if (password.length < 6) { toast('Password needs at least 6 characters'); return; }
    if (await createAccount(email, password)) renderSheet();
  },
  async 'acc-signin'() {
    const email = document.getElementById('acc-email').value.trim(), password = document.getElementById('acc-pw').value;
    if (!email || !password) { toast('Enter your email and password'); return; }
    if (db && myBooks().some(b => !b.demo) && !confirm('Signing in switches this device to that account. Books added here without an account will not move over. Continue?')) return;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { toast(/invalid/i.test(error.message) ? "That email and password don't match" : error.message); return; }
    try { localStorage.removeItem(STORE_KEY + ':' + ME); } catch (e) {}
    location.reload();
  },
  async 'sign-out'() {
    if (!confirm('Log out on this device?')) return;
    await sb.auth.signOut();
    try { localStorage.removeItem(cacheKey()); } catch (e) {}
    location.reload();
  },
  async 'sync-now'() { setSyncState('pending'); await refresh(); toast(syncState === 'error' ? 'Still not synced' : 'Synced'); renderSheet(); },
  'name-save'() {
    const n = document.getElementById('s-name').value.trim();
    if (!n) { toast("Name can't be empty"); return; }
    db.me.name = n; save(); render(); backToMenu(); toast('Saved');
  },
  'goal-set'(id) { db.me.goal = +id; save(); render(); toast(+id ? `Daily goal: ${id} pages` : 'No daily goal'); },
  'goal-custom'() {
    const v = prompt('Pages a day', db.me.goal || '');
    if (v === null) return;
    const n = parseInt(v, 10);
    db.me.goal = n > 0 ? Math.min(1000, n) : 0; save(); render();
  },
  disp(id, el) {
    const k = el.dataset.k;
    setDisplay({ [k]: k === 'comfy' ? id === '1' : id }); render();
  },
  'disp-reset'() { setDisplay({ ...DISPLAY_DEFAULT }); render(); toast('Display reset'); },
  async admin() {
    openSheet('admin', {});
    const { data, error } = await sb.rpc('admin_overview');
    if (ui.sheet !== 'admin') return;
    ui.sheetData = error ? { error: "Couldn't load: " + error.message } : { data }; renderSheet();
  },
  'demo-remove'() {
    const backup = JSON.parse(JSON.stringify(db));
    removeSamples(); save(); if (ui.sheet === 'settings') renderSheet(); render();
    toast('Sample data removed', () => { db = backup; save(); render(); });
  },
  export() {
    const mine = { me: db.me, books: myBooks(), posts: db.posts.filter(p => p.userId === ME), log: db.log, exportedAt: new Date().toISOString() };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(mine, null, 2)], { type: 'application/json' }));
    a.download = 'shelfmates-backup-' + dayStr() + '.json'; a.click();
  },
  reset() {
    if (!confirm('Erase all your books, clubs and posts on this phone? This cannot be undone.')) return;
    localStorage.removeItem(cacheKey()); db = null; ui.sheet = null; render();
  },

  /* clubs */
  'create-open'() { openSheet('create'); },
  'create-save'() {
    const name = document.getElementById('g-name').value.trim();
    if (!name) { toast('Give your club a name'); return; }
    const g = { id: uid(), name, code: joinCode(), members: [ME], createdBy: ME, createdAt: Date.now() };
    db.groups.push(g); save();
    ui.clubPage = g.id; ui.clubTab = 'members'; ui.sheet = null; render();
    openSheet('invite', { id: g.id });
    toast('Club created. Invite a few people.');
  },
  club(id) { ui.clubPage = id; ui.clubTab = 'books'; ui.sheet = null; render(); scrollTo(0, 0); },
  'club-back'() { ui.clubPage = null; render(); scrollTo(0, 0); },
  'club-tab'(id) { ui.clubTab = id; render(); },
  invite(id) { openSheet('invite', { id }); },
  async member(id) {
    openSheet('member', { id });
    if (!CLOUD || id === ME || String(id).startsWith('demo_')) return;
    const { data } = await sb.rpc('member_clubs', { p_user: id });
    if (ui.sheet !== 'member' || ui.sheetData.id !== id || !data) return;
    const mine = new Set(myClubs().map(g => g.name));
    ui.sheetData.clubs = data.map(r => r.name).filter(n => !mine.has(n));
    renderSheet();
  },
  whatsapp(id) {
    const g = db.groups.find(x => x.id === id);
    const msg = `Join my reading club "${g.name}" on ${APP.first} ${APP.second} 📚\n${inviteLink(g)}\nOr use code: ${g.code.toUpperCase()}`;
    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
  },
  async 'copy-link'(id) {
    const g = db.groups.find(x => x.id === id);
    try { await navigator.clipboard.writeText(inviteLink(g)); ui.sheetData.copied = true; renderSheet(); }
    catch (e) { toast('Could not copy. The code works too: ' + g.code.toUpperCase()); }
  },
  async 'leave-club'(id) {
    const g = db.groups.find(x => x.id === id);
    if (!confirm(`Leave ${g.name}? You can rejoin with the code.`)) return;
    const { error } = await sb.from('group_members').delete().eq('group_id', id).eq('user_id', ME);
    if (error) { toast(error.message); return; }
    db.groups = db.groups.filter(x => x.id !== id); save(); ui.clubPage = null; closeSheet(); toast('You left ' + g.name);
  },

  /* books */
  'add-open'() { ui.search = { q: '', loading: false, results: [], error: '' }; openSheet('add'); },
  'add-result'(i, el) {
    const list = el.dataset.src === 'suggest' ? ui.sheetData.suggest : ui.search.results;
    const r = list && list[+i]; if (!r) return;
    const status = el.dataset.status;
    if (!addBook({ ...r, status })) return;
    if (status === 'reading') { ui.sheet = null; if (!ui.clubPage) ui.tab = 'shelf'; render(); scrollTo(0, 0); celebrate('start', r); }
    else { ui.shelfTab = 'want'; render(); renderResults(); wantToast(r.title); }
  },
  'manual-open'() { openSheet('manual', { photo: '', title: ui.search.q || '' }); },
  'manual-save'(_, el) {
    const title = document.getElementById('m-title').value.trim();
    if (!title) { toast('Add a title'); return; }
    const b = addBook({ title, author: document.getElementById('m-author').value.trim(), pages: +document.getElementById('m-pages').value || 0, photo: ui.sheetData.photo || '', status: el.dataset.status });
    if (!b) return;
    if (b.status === 'want') ui.shelfTab = 'want';
    ui.sheet = null; if (!ui.clubPage) ui.tab = 'shelf'; render(); if (b.status === 'reading') celebrate('start', b); else wantToast(b.title);
  },
  book(id) { openSheet('book', { id }); },
  'track-toggle'(id) {
    const b = db.books.find(x => x.id === id); if (!b) return;
    updBook(id, { track: !tracked(b) }); render();
  },
  finish(id) {
    const b = db.books.find(x => x.id === id);
    if (b.pages && tracked(b)) logPages(b, b.pages - b.page);
    updBook(id, { status: 'finished', page: b.pages || b.page, percent: 100 });
    ui.sheet = null; render(); celebrate('finish', b);
  },
  'share-this'(id) { ui.share = { bookId: id, reaction: null, text: '', photo: '' }; ui.sheet = null; ui.tab = 'share'; render(); scrollTo(0, 0); },
  pause(id) {
    updBook(id, { status: 'paused' }); ui.shelfTab = 'paused'; closeSheet();
    toast('Paused. Pick it up whenever.', () => { updBook(id, { status: 'reading' }); render(); });
  },
  resume(id) { updBook(id, { status: 'reading' }); closeSheet(); },
  start(id) { updBook(id, { status: 'reading' }); closeSheet(); celebrate('start', db.books.find(x => x.id === id)); },
  remove(id) {
    const b = db.books.find(x => x.id === id); if (!b) return;
    db.books = db.books.filter(x => x.id !== id); save(); closeSheet();
    toast('Removed from your shelf', () => { db.books.push(b); save(); render(); });
  },
  'save-book'(id) { const b = db.books.find(x => x.id === id); if (b) saveFromOther(b, b.userId); },
  'save-post'(id) { const p = db.posts.find(x => x.id === id); if (p) saveFromOther(p, p.userId); },
  'delete-post'(id) {
    const p = db.posts.find(x => x.id === id); if (!p) return;
    db.posts = db.posts.filter(x => x.id !== id); save(); render();
    toast('Post deleted', () => { db.posts.push(p); save(); render(); });
  },
  'share-book'(id) { ui.share.bookId = id; render(); },
  react(k) { ui.share.text = document.getElementById('thought')?.value ?? ui.share.text; ui.share.reaction = k; render(); },
  'share-photo-remove'() { ui.share.photo = ''; render(); },
  post() {
    const s = ui.share, b = db.books.find(x => x.id === s.bookId);
    if (!b || !s.reaction) return;
    const text = (document.getElementById('thought')?.value || '').trim();
    if (b.status !== 'finished' && b.pages && tracked(b)) logPages(b, b.pages - b.page);
    const post = { id: uid(), userId: ME, title: b.title, author: b.author, pages: b.pages, coverUrl: b.photo || b.coverUrl, reaction: s.reaction, text, photo: s.photo, createdAt: Date.now() };
    db.posts.push(post);
    Object.assign(b, { status: 'finished', page: b.pages || b.page, percent: 100, updatedAt: Date.now() });
    if (!save()) { db.posts.pop(); return; }
    ui.share = { bookId: null, reaction: null, text: '', photo: '' };
    ui.tab = 'discover'; ui.club = 'all'; render(); scrollTo(0, 0); toast('Shared with your clubs');
  },

  /* today + calendar */
  'today-open'() { openSheet('today'); },
  calendar() { openSheet('calendar', { month: dayStr().slice(0, 7), sel: dayStr() }); },
  'cal-month'(m) { ui.sheetData.month = m; renderSheet(); },
  'cal-day'(ds) { ui.sheetData.sel = ds; renderSheet(); },
  close() { closeSheet(); },
  overlay(_, el, e) { if (e.target === el) closeSheet(); }
};

async function createAccount(email, password) {
  let r = await sb.auth.updateUser({ email });
  if (r.error) { toast(/already|registered|exists/i.test(r.error.message) ? 'That email already has an account. Use Sign in instead.' : r.error.message); return false; }
  r = await sb.auth.updateUser({ password });
  if (r.error) { toast(r.error.message); return false; }
  authUser = r.data.user || authUser;
  toast('Account created ☁️ Your books are safe.');
  return true;
}

/* ---------- progress: slider + number box ---------- */
function syncProgress(id, raw, commit) {
  const b = db.books.find(x => x.id === id); if (!b) return;
  const max = progMax(b);
  let v = Math.round(+raw);
  if (!isFinite(v)) return;
  v = Math.max(0, Math.min(max, v));
  const tmp = Object.assign({}, b, b.pages ? { page: v } : { percent: v });
  document.querySelectorAll(`[data-prog-range="${id}"]`).forEach(el => { el.value = v; el.style.setProperty('--p', pct(tmp) + '%'); });
  document.querySelectorAll(`[data-prog-num="${id}"]`).forEach(el => { if (commit || el !== document.activeElement) el.value = v; });
  document.querySelectorAll(`[data-prog-label="${id}"]`).forEach(el => { el.textContent = progLabel(tmp); });
  if (!commit) return;
  const patch = b.pages ? { page: v } : { percent: v };
  if (b.pages) logPages(b, v - b.page);
  if (b.status === 'finished' && v < max) patch.status = 'reading';
  updBook(id, patch);
  const n = document.getElementById('today-num-s'); if (n) n.textContent = pagesOn(dayStr());
  if (patch.status) { render(); toast('Moved back to Reading now'); }
  else if (v === max && b.status === 'reading') toast('Last page! Tap “I finished it” when you’re done.');
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'overlay' && e.target !== el) return;
  e.preventDefault();
  const fn = actions[act];
  if (fn) fn(el.dataset.id, el, e);
});
document.addEventListener('scroll', e => {
  const el = e.target;
  if (!(el instanceof HTMLElement) || !el.classList.contains('tslides')) return;
  const i = Math.round(el.scrollLeft / el.clientWidth);
  el.parentElement.querySelectorAll('.tpager i').forEach((d, k) => d.classList.toggle('on', k === i));
}, true);
document.addEventListener('submit', e => {
  if (e.target.dataset.form === 'search') {
    e.preventDefault();
    const q = document.getElementById('q').value.trim();
    clearTimeout(searchTimer);
    if (q) { ui.search.q = q; ui.search.loading = true; renderResults(); searchBooks(q); }
    document.getElementById('q').blur();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.progRange) syncProgress(t.dataset.progRange, t.value, false);
  if (t.dataset && t.dataset.progNum && t.value !== '') syncProgress(t.dataset.progNum, t.value, false);
  if (t.id === 'thought') ui.share.text = t.value;
  if (t.id === 'q') queueSearch(t.value.trim());
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'ob-name') actions.onboard();
  if (e.key === 'Enter' && e.target.id === 'g-name') actions['create-save']();
  if (e.key === 'Escape' && ui.sheet) closeSheet();
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset && t.dataset.progRange) syncProgress(t.dataset.progRange, t.value, true);
  if (t.dataset && t.dataset.progNum) syncProgress(t.dataset.progNum, t.value === '' ? 0 : t.value, true);
  if (t.dataset && t.dataset.pref === 'progress') {
    db.me.showProgress = t.checked; save(); render();
    toast(t.checked ? 'Your clubs can see your progress' : 'Progress hidden. Clubs only see the book.');
  }
  if (t.dataset && t.dataset.pref === 'clubs') {
    db.me.showClubs = t.checked; save(); renderSheet();
    toast(t.checked ? 'People in your clubs can see your other clubs' : 'Your clubs are private again');
  }
  if (t.dataset && t.dataset.track) { updBook(t.dataset.track, { track: t.checked }); render(); }
  if (t.dataset && t.dataset.pagesFor) {
    const b = db.books.find(x => x.id === t.dataset.pagesFor); if (!b) return;
    const total = Math.max(0, parseInt(t.value, 10) || 0);
    if (total === b.pages) return;
    const p = pct(b);
    updBook(b.id, total ? { pages: total, page: b.pages ? Math.min(b.page, total) : Math.round(p / 100 * total) } : { pages: 0, percent: p });
    render();
  }
  if (!(t instanceof HTMLInputElement) || t.type !== 'file' || !t.files?.[0]) return;
  let url;
  try { url = await readPhoto(t.files[0]); } catch (err) { toast("Couldn't read that photo"); return; }
  if (t.dataset.photoFor) {
    const b = db.books.find(x => x.id === t.dataset.photoFor);
    const old = b.photo; b.photo = url; b.updatedAt = Date.now();
    if (!save()) { b.photo = old; return; }
    render(); toast('Cover photo updated', () => { b.photo = old; save(); render(); });
  } else if (t.dataset.sharePhoto) {
    ui.share.text = document.getElementById('thought')?.value || ui.share.text;
    ui.share.photo = url; render();
  } else if (t.dataset.manualPhoto) {
    ['title', 'author', 'pages'].forEach(k => { const el = document.getElementById('m-' + k); if (el) ui.sheetData[k] = el.value; });
    ui.sheetData.photo = url; renderSheet();
  }
});

/* ============================================================
   Start
   ============================================================ */
(async function init() {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!CLOUD) { db = load(); render(); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  ui.loading = true; render();
  try {
    let { data: { session } } = await sb.auth.getSession();
    if (!session) {
      const r = await sb.auth.signInAnonymously();
      if (r.error) throw r.error;
      session = r.data.session;
    }
    authUser = session.user; ME = authUser.id;
    sb.auth.onAuthStateChange((event, s) => {
      if (s && s.user && s.user.id !== ME) { location.reload(); return; }
      if (s && s.user) authUser = s.user;
    });
    db = load();
    ui.loading = !db; render();
    await pull();
    ui.loading = false;
    if (db && pendingJoin) await joinByCode(pendingJoin);
    else render();
    if (!db && pendingJoin) {
      const { data } = await sb.rpc('club_preview', { p_code: pendingJoin });
      const row = Array.isArray(data) ? data[0] : data;
      const el = document.getElementById('invite-title');
      if (row && el) el.textContent = `You're invited to ${row.name} · ${row.members} ${row.members === 1 ? 'member' : 'members'}`;
    }
  } catch (e) {
    console.error(e);
    ui.loading = false; setSyncState('error');
    db = db || load(); render();
    toast("Couldn't reach the server: " + ((e && (e.message || e.error_description)) || e));
  }
})();
</script>
