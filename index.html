<style>
/* ============================================================
   HomeBase design system tokens (dark default + light)
   ============================================================ */
:root, [data-theme="dark"] {
  --bg:#121419; --card:#1c1f27; --soft:#262a34; --line:#2c303b;
  --ink:#ecedf0; --on-ink:#121419; --muted:#9a9ea9;
  --accent:#2f6fdb;
  --red:#e8766d; --red-soft:#3a2224; --green:#5dbb7e; --green-soft:#1f3328; --blue:#7fa9d6; --blue-soft:#1f2b3a; --warning:#e8a21c;
  --shadow-float:0 6px 18px rgba(0,0,0,.45);
  color-scheme: dark;
}
[data-theme="light"] {
  --bg:#faf7f2; --card:#ffffff; --soft:#f1eee8; --line:#e8e2d7;
  --ink:#1c1f2a; --on-ink:#ffffff; --muted:#6b6f7a;
  --red:#c8463d; --red-soft:#fbeae8; --green:#3f8f5b; --green-soft:#e7f3eb; --blue:#3c6e9f; --blue-soft:#e6eef6;
  --shadow-float:0 6px 18px rgba(28,31,42,.12);
  color-scheme: light;
}
:root {
  --accent-soft: color-mix(in srgb, var(--accent) 20%, var(--bg));
  --accent-text: color-mix(in srgb, var(--accent) 72%, var(--ink));
  --font-display: Fraunces, Georgia, serif;
  --font-sans: Inter, system-ui, -apple-system, sans-serif;
  --radius-sm:.5rem; --radius-md:.6rem; --radius-lg:.8rem; --radius-sheet:1.1rem; --radius-pill:99px;
}

/* ============================================================
   HomeBase components (from the design system bundle)
   ============================================================ */
html { font-size: 14px; }
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); font-size: 1rem; line-height: 1.4; -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: 7rem; }
.hb-header { display: flex; align-items: center; justify-content: space-between; gap: .6rem; padding: calc(.7rem + env(safe-area-inset-top)) 1rem .5rem; position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); z-index: 5; }
.hb-logo { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; letter-spacing: -.4px; margin: 0; user-select: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-logo span { color: var(--accent); }
.hb-main { padding: 0 1rem; }
.sheet-title { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; margin: .2rem 0 .6rem; }
.section-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); font-weight: 600; margin: 1.1rem 0 .45rem; display: flex; justify-content: space-between; align-items: baseline; }
.sub { color: var(--muted); font-size: .85rem; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: .6rem .8rem; margin-bottom: .5rem; }
.row { display: flex; align-items: center; gap: .6rem; }
.grow { flex: 1; min-width: 0; }
.item-title { font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: .82rem; color: var(--muted); margin-top: 1px; display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
.src { font-size: 1.1rem; width: 1.8rem; text-align: center; flex-shrink: 0; }
.empty { text-align: center; color: var(--muted); padding: 1.4rem .6rem; font-size: .88rem; line-height: 1.5; }

.pill { font-size: .7rem; font-weight: 600; padding: .08rem .45rem; border-radius: var(--radius-pill); white-space: nowrap; }
.pill.ok { background: var(--green-soft); color: var(--green); }
.pill.info { background: var(--blue-soft); color: var(--blue); }
.pill.soon { background: var(--accent-soft); color: var(--accent-text); }
.pill.late { background: var(--red-soft); color: var(--red); }
.pill.later { background: var(--soft); color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius-md); padding: .4rem .8rem; min-height: 2.3rem; font-size: .88rem; font-weight: 500; cursor: pointer; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: .35rem; }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.accent { background: var(--accent); color: var(--on-accent, #fff); border-color: var(--accent); }
.btn.danger { color: var(--red); }
.btn.block { width: 100%; min-height: 2.8rem; }
.btn:disabled { opacity: .45; cursor: default; }
.actions { display: flex; gap: .4rem; margin-top: .6rem; flex-wrap: wrap; }
.formbtns { display: flex; gap: .5rem; margin-top: 1.1rem; }
.email-hint { font-size: .82rem; color: var(--ink); margin-top: .3rem; min-height: 0; }
.email-hint:empty { display: none; }
.email-hint .link { padding: 0 .2rem; font-weight: 600; }
.pw-wrap { position: relative; }
.pw-wrap .hb-input { padding-right: 2.8rem; }
.pw-eye { position: absolute; right: .3rem; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1.05rem; padding: .4rem; cursor: pointer; opacity: .55; }
.pw-eye[aria-pressed="true"] { opacity: 1; }
.sheet-head { position: sticky; top: -1.1rem; z-index: 5; display: flex; align-items: center; gap: .5rem; margin: -1.1rem -1rem .7rem; padding: .8rem 1rem .7rem; background: var(--bg); border-bottom: 1px solid var(--line); }
.sheet-head .sh-mid { flex: 1; min-width: 0; }
.sheet-head .sheet-title { font-size: 1.12rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-head .sh-left { background: none; border: none; color: var(--accent-text); font: inherit; font-size: .95rem; font-weight: 600; padding: .45rem .5rem .45rem .1rem; min-height: 2.6rem; cursor: pointer; white-space: nowrap; min-width: 0; order: 0; border-radius: 10px; }
.sheet-head .sh-left:hover { background: var(--soft); }
.sheet-head .sh-left:empty { display: none; }
.sheet-head .sh-mid { order: 1; }
.sheet-head .sh-left + .sh-mid { text-align: left; }
.sheet-head .sh-right { order: 2; border: none; border-radius: 999px; padding: .45rem 1.1rem; min-height: 2.3rem; font: inherit; font-weight: 600; font-size: .92rem; background: var(--accent); color: var(--on-accent); cursor: pointer; white-space: nowrap; }
.sheet-head .sh-right.soft { background: var(--soft); color: var(--ink); }
.sheet-head .sh-right:disabled { opacity: .6; }
.stampbox > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
.stampbox > summary::-webkit-details-marker { display: none; }
.stampbox > summary::after { content: '▾'; font-size: .9rem; transition: transform .2s; }
.stampbox:not([open]) > summary::after { transform: rotate(-90deg); }
.formbtns .btn { flex: 1; min-height: 2.7rem; }
.iconbtn { background: none; border: 1px solid var(--line); border-radius: var(--radius-md); width: 2.4rem; height: 2.4rem; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; color: var(--ink); position: relative; display: inline-flex; align-items: center; justify-content: center; }
.iconbtn::after { content: ''; position: absolute; inset: -4px; }
.syncdot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.syncdot.pending { background: var(--warning); } .syncdot.error { background: var(--red); }
.link { background: none; border: none; color: var(--accent-text); font-weight: 600; font-size: .88rem; padding: .6rem .3rem; min-height: 2.6rem; cursor: pointer; }
.btn { min-height: 2.6rem; }
.sheet-title, .item-title { overflow-wrap: anywhere; }
.fb-img button::after, .pw-eye::after { content: ''; position: absolute; inset: -.6rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.chips { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: 2px; margin-bottom: .6rem; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius-pill); padding: .35rem .85rem; min-height: 2.2rem; font-size: .88rem; cursor: pointer; white-space: nowrap; color: var(--ink); }
.chip.on { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chip.sm { min-height: 2.3rem; padding: .25rem .75rem; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: .6rem .75rem; }
.stat .n { font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; }
.stat .l { font-size: .76rem; color: var(--muted); line-height: 1.25; }
.stat.hl { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.stat.hl .l { color: var(--on-ink); opacity: .72; }

.hb-label { display: block; font-size: .82rem; font-weight: 600; margin: .7rem 0 .3rem; }
.hb-input { width: 100%; min-width: 0; min-height: 2.6rem; border: 1px solid var(--line); background: var(--card); border-radius: var(--radius-md); padding: .5rem .7rem; font-size: max(16px, 1rem); color: var(--ink); }
.hb-input:focus { outline: none; border-color: var(--accent); }
textarea.hb-input { resize: none; line-height: 1.5; }
.fb-foot { text-align: center; margin: 2rem 0 .5rem; }
.fb-foot button { all: unset; cursor: pointer; font-size: .85rem; color: var(--muted); padding: .4rem .8rem; border-radius: 999px; }
.fb-foot button:hover, .fb-foot button:focus-visible { background: var(--soft); color: var(--ink); }
.fb-count { text-align: right; font-size: .75rem; color: var(--muted); margin-top: .2rem; }
.fb-imgs { display: flex; gap: .5rem; flex-wrap: wrap; margin: .5rem 0; }
.fb-img { position: relative; width: 4.5rem; height: 4.5rem; border-radius: .6rem; overflow: hidden; border: 1px solid var(--line); background: var(--soft); }
.fb-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fb-img button { position: absolute; top: .15rem; right: .15rem; width: 1.4rem; height: 1.4rem; border-radius: 50%; border: none; background: rgba(0,0,0,.6); color: #fff; font-size: .8rem; line-height: 1; cursor: pointer; }
.fb-add { width: 4.5rem; height: 4.5rem; border-radius: .6rem; border: 1.5px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: .7rem; color: var(--muted); cursor: pointer; gap: .1rem; }
.fb-add span { font-size: 1.2rem; }
.fb-card { padding: .8rem; }
.fb-card.done { opacity: .6; }
.fb-card .fb-msg { white-space: pre-wrap; word-break: break-word; margin: .3rem 0; }
.fb-card .fb-imgs a { display: block; width: 4.5rem; height: 4.5rem; border-radius: .5rem; overflow: hidden; border: 1px solid var(--line); }
.fb-card .fb-imgs img { width: 100%; height: 100%; object-fit: cover; }

.mgroup { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; margin-top: .7rem; }
.mrow { display: flex; align-items: center; gap: .7rem; width: 100%; min-height: 3rem; padding: .55rem .85rem; background: none; border: none; border-bottom: 1px solid var(--line); color: var(--ink); text-align: left; cursor: pointer; }
.mgroup .mrow:last-child { border-bottom: none; }
.mrow .mi { font-size: 1.1rem; width: 1.5rem; text-align: center; flex-shrink: 0; }
.mrow .mt { flex: 1; font-weight: 500; min-width: 0; }
.mrow .mt small { display: block; font-weight: 400; font-size: .78rem; color: var(--muted); margin-top: 1px; }
.mrow .ms { color: var(--muted); font-size: .82rem; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .mc { color: var(--muted); font-size: 1.1rem; }
.mrow.danger .mt { color: var(--red); } .mrow.danger .mc { display: none; }
.mrow.static { cursor: default; }

.switch { position: relative; display: inline-block; width: 2.6rem; height: 1.5rem; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--soft); border: 1px solid var(--line); border-radius: var(--radius-pill); transition: .2s; cursor: pointer; }
.switch span::before { content: ''; position: absolute; width: 1.1rem; height: 1.1rem; left: .15rem; top: 50%; transform: translateY(-50%); background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.switch input:checked + span { background: var(--green); border-color: var(--green); }
.switch input:checked + span::before { transform: translate(1.1rem, -50%); }

.swatches { display: flex; gap: .7rem; flex-wrap: wrap; }
.swatch { width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 3px solid var(--bg); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; position: relative; }
.swatch::after { content: ''; position: absolute; inset: -5px; }
.swatch.on { box-shadow: 0 0 0 2px var(--ink); }

.banner { display: flex; gap: .6rem; align-items: flex-start; border-radius: var(--radius-lg); padding: .6rem .8rem; border: 1px solid var(--line); margin: .6rem 0; }
.banner.accent { background: var(--accent-soft); }
.banner.info { background: var(--blue-soft); }
.banner.warn { background: color-mix(in srgb, #f59e0b 14%, var(--card)); border-color: color-mix(in srgb, #f59e0b 40%, var(--line)); }
.banner .b-icon { font-size: 1.3rem; }

.overlay { position: fixed; inset: 0; background: rgba(10,12,18,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.overlay.anim { animation: fade .2s ease-out; }
.overlay.anim .sheet { animation: up .24s cubic-bezier(.2,.8,.2,1); }
.sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; padding: 1.1rem 1rem calc(1.6rem + env(safe-area-inset-bottom)); max-height: 92vh; overflow-y: auto; }
.sheet.tall { min-height: 80vh; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } }
@keyframes fade { from { background: rgba(10,12,18,0); } }

.toast { background: var(--ink); color: var(--on-ink); padding: .4rem .4rem .4rem .9rem; border-radius: var(--radius-md); font-size: .88rem; display: inline-flex; align-items: center; gap: .5rem; max-width: calc(100vw - 32px); box-shadow: var(--shadow-float); min-height: 2.6rem; }
.toast.fixed { position: fixed; bottom: calc(8rem + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 30; transition: opacity .2s; }
.toast.hide { opacity: 0; pointer-events: none; }
.toast button { background: none; border: none; color: var(--accent); filter: brightness(1.3); font-weight: 700; cursor: pointer; padding: 0 .7rem; min-height: 2.4rem; text-transform: uppercase; letter-spacing: .5px; }
[data-theme="light"] .toast button { filter: brightness(1.6); }

.hb-nav { background: var(--card); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
.hb-nav.fixed { position: fixed; bottom: 0; left: 0; right: 0; z-index: 10; }
.hb-nav .inner { display: flex; max-width: 560px; width: 100%; }
.hb-nav button { flex: 1; min-width: 0; min-height: 3.3rem; background: none; border: none; padding: .4rem 0 .5rem; font-size: .7rem; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.hb-nav button .ic { font-size: 1.2rem; filter: grayscale(1); opacity: .55; }
.hb-nav button.on { color: var(--ink); font-weight: 600; }
.hb-nav button.on .ic { filter: none; opacity: 1; }
.fab { width: 3.2rem; height: 3.2rem; border-radius: 50%; background: var(--accent); color: var(--on-accent, #fff); font-size: 1.6rem; border: none; box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent); cursor: pointer; }
.fab.fixed { position: fixed; bottom: calc(4.2rem + env(safe-area-inset-bottom)); right: max(1rem, calc(50% - 264px)); z-index: 11; }

html.comfy .card { padding: .85rem 1rem; margin-bottom: .7rem; }
html.comfy .btn, html.comfy .chip { min-height: 2.75rem; }

#tex, #tw { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
#tw { animation: twinkle 3.2s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }
body { background: var(--bg); }
.fcover .gen b, .item-title.clamp2, .tslide .item-title { font-family: var(--font-display); font-weight: 600; }
.moodcard { border: 1px solid var(--line); border-radius: var(--radius-lg); padding: .55rem .6rem; text-align: left; cursor: pointer; display: flex; gap: .55rem; align-items: center; color: var(--ink); }
.moodcard.on { outline: 2px solid var(--ink); outline-offset: -1px; }
.moodcard .sw2 { width: 2.2rem; height: 2.8rem; border-radius: 4px; flex-shrink: 0; position: relative; overflow: hidden; border: 1px solid rgba(0,0,0,.08); }
.moodcard .sw2 i { position: absolute; left: 0; right: 0; bottom: 0; height: 35%; }
.moodcard b { display: block; font-size: .88rem; font-weight: 600; }
.moodcard small { display: block; font-size: .72rem; color: var(--muted); }
.moodgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
/* ---------- layout pieces (phone first) ---------- */
.home-grid { display: block; }
.feed { display: block; }
.side-logo, .hb-nav .side-only { display: none; }
.toast.fixed.top { bottom: auto; top: calc(1rem + env(safe-area-inset-top)); }

/* ---------- laptops and tablets in landscape ---------- */
@media (min-width: 900px) {
  .app { max-width: 1180px; padding: 0 2rem 3rem 252px; }
  .app.no-nav { padding-left: 2rem; }
  .hb-header { padding: 1.4rem 0 .8rem; position: static; background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .hb-main { padding: 0; }
  .hb-nav.fixed { top: 0; bottom: 0; left: 0; right: auto; width: 220px; border-top: none; border-right: 1px solid var(--line); padding: 1.4rem .8rem; align-items: stretch; justify-content: flex-start; }
  .hb-nav .inner { flex-direction: column; gap: .2rem; }
  .hb-nav button { flex: none; flex-direction: row; justify-content: flex-start; gap: .7rem; min-height: 2.8rem; padding: 0 .8rem; font-size: .95rem; border-radius: var(--radius-md); }
  .hb-nav button.on { background: var(--soft); }
  .hb-nav button .ic { font-size: 1.15rem; }
  .side-logo { display: block; font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; padding: 0 .8rem 1.2rem; }
  .side-logo span { color: var(--accent); }
  .hb-nav .side-only { display: flex !important; margin-top: auto; }
  .hb-header .iconbtn[data-act="settings"] { display: none; }
  .home-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 1.4rem; align-items: start; }
  .home-grid .home-right .section-label:first-child { margin-top: .3rem; }
  .feed { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .8rem; align-items: start; }
  .feed .card { margin: 0; }
  .shelf { grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); }
  .carousel { margin: 0; padding: 2px 0 .4rem; }
  .pick-row { margin: 0; padding: 4px 0 .4rem; }
  .overlay { align-items: center; padding: 2rem; }
  .sheet { border-radius: var(--radius-sheet); max-height: 86vh; width: min(560px, 100%); padding: 1.4rem 1.4rem 1.4rem; }
  .sheet.tall { min-height: 0; }
  .fab.fixed { right: 2rem; bottom: 2rem; }
  .toast.fixed { bottom: 2rem; }
  .welcome { padding-top: 4rem; }
}

/* ============================================================
   Shelfmates additions, built from the same tokens
   ============================================================ */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* covers */
.cover { border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-family: var(--font-display); font-weight: 700; overflow: hidden; object-fit: cover; background: #2C3E50; }
.fcover { display: block; position: relative; width: 100%; aspect-ratio: 2/3; border-radius: 6px; overflow: hidden; background: #2C3E50; border: 1px solid var(--line); }
.fcover img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }

/* today dial */

/* 📖 club read */

/* ---------- language check on shared thoughts ----------
   Strong words: a gentle "post anyway?" nudge. Slurs: not allowed. Private journal entries are never checked.
   Whole words only, so book titles and names like "Scunthorpe" or "Dick Francis" don't trip it. */
const LANG_STRONG = ['fuck', 'fucking', 'fucked', 'fucker', 'motherfucker', 'shit', 'shitty', 'bullshit', 'bitch', 'bitches', 'bastard', 'asshole', 'arsehole',
  'cunt', 'wanker', 'twat', 'prick', 'slut', 'whore', 'dickhead', 'bollocks', 'fag',
  'chutiya', 'chutiye', 'chutia', 'madarchod', 'maderchod', 'behenchod', 'bhenchod', 'bhanchod', 'bhosdike', 'bhosdi', 'bhosda', 'bsdk', 'bkl', 'gandu', 'gaandu',
  'lavde', 'lawde', 'lauda', 'lund', 'randi', 'harami', 'haramkhor',
  'thevidiya', 'thevdiya', 'punda', 'pundai', 'koothi', 'oombu', 'soole', 'bolimaga', 'lanja', 'lanjakodaka', 'dengey'];
const LANG_BLOCK = ['nigger', 'nigga', 'faggot', 'retard', 'retarded', 'chink', 'chinki', 'chinky', 'kike', 'spic', 'wetback', 'tranny', 'trannies', 'paki', 'gook',
  'raghead', 'towelhead', 'chamar', 'bhangi', 'katua'];
const langRx = list => list.map(w => new RegExp('^' + w.split('').map(c => c + '+').join('') + '(s|es|z)?$'));
const LANG_RX = { strong: langRx(LANG_STRONG), block: langRx(LANG_BLOCK) };
let langXKey = null, langX = { strong: [], block: [] };
function langExtra() {
  const e = appCfg().lang_extra || {}, k = JSON.stringify(e);
  if (k !== langXKey) { langXKey = k; const clean = a => (Array.isArray(a) ? a : []).map(w => String(w).toLowerCase().replace(/[^a-z]/g, '')).filter(w => w.length > 1); langX = { strong: langRx(clean(e.strong)), block: langRx(clean(e.block)) }; }
  return langX;
}
function langCheck(text) {
  const t = String(text || '').toLowerCase().replace(/([a-z])!([a-z])/g, '$1i$2').replace(/[0@4$5137]/g, c => ({ 0: 'o', '@': 'a', 4: 'a', $: 's', 5: 's', 1: 'i', 3: 'e', 7: 't' }[c]));
  const words = t.split(/[^a-z]+/).filter(Boolean);
  const X = langExtra();
  if (words.some(w => LANG_RX.block.some(r => r.test(w)) || X.block.some(r => r.test(w)))) return 'block';
  if (words.some(w => LANG_RX.strong.some(r => r.test(w)) || X.strong.some(r => r.test(w)))) return 'strong';
  return '';
}
/* true if it's OK to share this text with clubs */
function langOK(text) {

  if (c === 'strong') return confirm('Heads up: this has a strong word, and your club friends will see it.\n\nOK to post anyway, or Cancel to edit.');
  return true;
}

/* write a row; if the database doesn't have a new column yet (update not run), leave that column out and carry on */
const NOCOL = {};
async function upsertSafe(table, row, opts) {

    const { error } = await sb.from(table).upsert(r, opts);
    if (!error) return null;
    const m = /'(\w+)' column|column "?(\w+)"? (?:of relation \S+ )?does not exist/i.exec(error.message || '');
    const k = m && (m[1] || m[2]);

const noTable = e => e && (/42P01|PGRST205/.test(e.code || '') || /does not exist|could not find the table|schema cache/i.test(e.message || ''));

async function uploadPhoto(dataUrl) {
  const blob = await (await fetch(dataUrl)).blob();
  const path = `${ME}/${uid()}.jpg`;
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
  if (error) throw error;
  return sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
}

async function sync() {
  if (!CLOUD || !db || !authUser || PREVIEW) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  setSyncState('pending');
  try {
    // profile (upload a new photo first)
    if (db.me.avatar && db.me.avatar.startsWith('data:')) { db.me.avatar = await uploadPhoto(db.me.avatar); localStorage.setItem(cacheKey(), JSON.stringify(db)); }
    const pr = profileRow(), prJ = JSON.stringify(pr);
    if (synced['p:me'] !== prJ) { const error = await upsertSafe('profiles', pr); if (error) throw error; synced['p:me'] = prJ; }

    // groups I created (+ my membership)
    for (const g of db.groups.filter(g => !g.demo && (g.createdBy || ME) === ME)) {
      const row = groupRow(g), j = JSON.stringify(row);
      if (synced['g:' + g.id] === j) continue;
      const isNew = !synced['g:' + g.id];
      const { error } = isNew ? await sb.from('groups').insert(row) : await sb.from('groups').update({ name: g.name }).eq('id', g.id);
      if (error) throw error;
      if (isNew) { const r = await sb.from('group_members').insert({ group_id: g.id, user_id: ME }); if (r.error && r.error.code !== '23505') throw r.error; }
      synced['g:' + g.id] = j;
    }

    // my books (upload any new photos first)
    const mine = db.books.filter(b => b.userId === ME && !b.demo);
    for (const b of mine) {
      if (b.photo && b.photo.startsWith('data:')) { b.photo = await uploadPhoto(b.photo); localStorage.setItem(cacheKey(), JSON.stringify(db)); }
      const row = bookRow(b), j = JSON.stringify(row);
      if (synced['b:' + b.id] === j) continue;
      const error = await upsertSafe('books', row); if (error) throw error;
      synced['b:' + b.id] = j; b.cloud = true; delete b.pendingNew;
    }
    const bookIds = new Set(mine.map(b => b.id));
    for (const k of Object.keys(synced).filter(k => k.startsWith('b:') && !bookIds.has(k.slice(2)))) {
      const { error } = await sb.from('books').delete().eq('id', k.slice(2)); if (error) throw error;
      delete synced[k];
    }

    // my private reading log (only books still in the cloud)
    for (const l of (db.log || [])) {
      if (!synced['b:' + l.bookId] && !db.books.some(b => b.id === l.bookId && b.userId === ME && !b.demo)) continue;
      if (!synced['b:' + l.bookId]) continue;
      const row = logRow(l), j = JSON.stringify(row);
      if (synced['l:' + l.id] === j) continue;
      const error = await upsertSafe('reading_log', row, { onConflict: 'user_id,book_id,day' }); if (error) throw error;
      synced['l:' + l.id] = j;
    }

    // my posts
    const myPosts = db.posts.filter(p => p.userId === ME && !p.demo);
    for (const p of myPosts) {
      if (p.photo && p.photo.startsWith('data:')) p.photo = await uploadPhoto(p.photo);
      if (p.coverUrl && p.coverUrl.startsWith('data:')) {
        const b = db.books.find(x => x.userId === ME && norm(x.title) === norm(p.title) && x.photo && !x.photo.startsWith('data:'));
        p.coverUrl = b ? b.photo : await uploadPhoto(p.coverUrl);
      }
      const row = postRow(p), j = JSON.stringify(row);
      if (synced['o:' + p.id] === j) continue;
      const error = await upsertSafe('posts', row); if (error) throw error;
      synced['o:' + p.id] = j; p.cloud = true; delete p.pendingNew;
    }
    const postIds = new Set(myPosts.map(p => p.id));
    for (const k of Object.keys(synced).filter(k => k.startsWith('o:') && !postIds.has(k.slice(2)))) {
      const { error } = await sb.from('posts').delete().eq('id', k.slice(2)); if (error) throw error;
      delete synced[k];
    }

    // my lines (photos go to a private folder) and reading sessions — skipped quietly until supabase-update-19 is run
    if (!NOCOL._lines) {
      for (const l of (db.lines || [])) {
        if (l.photo && l.photo.startsWith('data:')) {
          const blob = await (await fetch(l.photo)).blob(), path = `${ME}/${l.id}.jpg`;
          const up = await sb.storage.from('lines').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
          if (up.error) { if (/not found|bucket/i.test(up.error.message || '')) { NOCOL._lines = true; break; } throw up.error; }
          l.photoPath = path; l.photo = ''; localStorage.setItem(cacheKey(), JSON.stringify(db));
        }
        const row = lineRow(l), j = JSON.stringify(row);
        if (synced['n:' + l.id] === j) continue;
        const { error } = await sb.from('lines').upsert(row); if (noTable(error)) { NOCOL._lines = true; break; } if (error) throw error;
        synced['n:' + l.id] = j;
      }
      const lineIds = new Set((db.lines || []).map(l => l.id));
      for (const k of Object.keys(synced).filter(k => k.startsWith('n:') && !lineIds.has(k.slice(2)))) {
        const gone = (synced['n:' + k.slice(2)] || '').match(/"photo_path":"([^"]+)"/);
        const { error } = await sb.from('lines').delete().eq('id', k.slice(2)); if (error && !noTable(error)) throw error;
        if (gone) sb.storage.from('lines').remove([gone[1]]).then(() => {}, () => {});
        delete synced[k];
      }
    }
    if (!NOCOL._sessions) for (const x of (db.sessions || [])) {
      if (!x.id || synced['r:' + x.id]) continue;
      const { error } = await sb.from('reading_sessions').upsert(sessRow(x)); if (noTable(error)) { NOCOL._sessions = true; break; } if (error) throw error;

    }
    localStorage.setItem(cacheKey(), JSON.stringify(db));
    syncErrShown = false;
    setSyncState('ok');
  } catch (e) {
    console.error('Sync failed', e);

    if (!syncErrShown) { toast("Couldn't save to the cloud: " + ((e && e.message) || e)); syncErrShown = true; }
    clearTimeout(syncTimer); syncTimer = setTimeout(sync, 15000);
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; queueSync(); }
  }
}

  // what the cloud has now
  synced = { 'p:me': JSON.stringify(profileRow()) };
  db.log.forEach(l => synced['l:' + l.id] = JSON.stringify(logRow(l)));
  // keep newer local log entries
  ((prev && prev.log) || []).forEach(ll => {
    const cl = db.log.find(l => l.bookId === ll.bookId && l.day === ll.day);
    if (!cl) db.log.push(ll); else if ((ll.updatedAt || 0) > (cl.updatedAt || 0)) { cl.pages = ll.pages; if (ll.minutes) cl.minutes = ll.minutes; cl.updatedAt = ll.updatedAt; }
  });
  db.lines.forEach(l => synced['n:' + l.id] = JSON.stringify(lineRow(l)));
  db.sessions.forEach(x => { if (x.id) synced['r:' + x.id] = '1'; });
  ((prev && prev.lines) || []).filter(l => !l.cloud && !db.lines.some(x => x.id === l.id)).forEach(l => db.lines.push(l));
  ((prev && prev.sessions) || []).filter(x => !x.cloud && !db.sessions.some(y => y.id === x.id)).forEach(x => db.sessions.push(x));
  setTimeout(rnRefresh, 0);
  db.groups.filter(g => !g.demo && g.createdBy === ME).forEach(g => synced['g:' + g.id] = JSON.stringify(groupRow(g)));
  db.books.filter(b => b.userId === ME && !b.demo).forEach(b => synced['b:' + b.id] = JSON.stringify(bookRow(b)));
  db.posts.filter(p => p.userId === ME && !p.demo).forEach(p => synced['o:' + p.id] = JSON.stringify(postRow(p)));
  // re-apply unsynced local edits (newer than the cloud copy)
  localMine.forEach(lb => {
    const cb = db.books.find(b => b.id === lb.id);
    if (!cb) { if (!lb.cloud || (lb.photo && lb.photo.startsWith('data:')) || lb.pendingNew) db.books.push(lb); }
    else if ((lb.updatedAt || 0) > (cb.updatedAt || 0)) Object.assign(cb, lb);
  });
  (prev ? (prev.posts || []) : []).filter(p => (p.pendingNew || !p.cloud) && !p.demo && p.userId === ME && !db.posts.some(x => x.id === p.id)).forEach(p => db.posts.push(p));
  localStorage.setItem(cacheKey(), JSON.stringify(db));
  queueSync();
}

/* book description from Open Library, fetched only when someone opens the card */
const bookInfo = {};
async function loadBookInfo(x) {
  const key = norm(x.title); if (bookInfo[key]) return;
  const done = v => { bookInfo[key] = v; if (ui.sheet === 'fbook') renderSheet(); };
  try {
    const sr = await fetch('https://openlibrary.org/search.json?limit=1&fields=key,first_publish_year,number_of_pages_median&title=' + encodeURIComponent(x.title) + (x.author ? '&author=' + encodeURIComponent(x.author) : ''));
    const hit = (await sr.json()).docs?.[0];
    if (!hit) return done({ desc: '' });
    const w = await (await fetch('https://openlibrary.org' + hit.key + '.json')).json();
    let desc = typeof w.description === 'string' ? w.description : (w.description && w.description.value) || '';
    desc = desc.replace(/\r/g, '').split(/\n-{3,}|\n\s*\(\[source\]|\[source\]/)[0].replace(/\[([^\]]+)\]\([^)]+\)/g, '$1').trim();
    done({ desc, year: hit.first_publish_year || '', pages: hit.number_of_pages_median || 0 });
  } catch (e) { done({ desc: '', failed: true }); }
}

const MAIL_DOMAINS = ['mail.com', 'gmail.com', 'yahoo.com', 'yahoo.co.in', 'outlook.com', 'hotmail.com', 'icloud.com', 'rediffmail.com', 'live.com', 'protonmail.com', 'me.com', 'ymail.com', 'aol.com', 'outlook.in', 'zoho.com'];

    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1); } return d[m][n]; }

}

}

  Object.keys(c).forEach(k => { if (c[k] && !st[k]) earnStamp(k, first); });
  if (first) { st._init = 1; save(); }
}
let stampWait = 0, stampShown = null;
/* after an undo: take back recent stamps whose reason no longer holds */
function recheckStamps(extra = [], always = false) {
  if (!db || !db.me.stamps) return;
  const st = db.me.stamps, c = stampConditions(), now = Date.now(); let changed = false;
  Object.keys(c).concat(extra).forEach(k => {
    if (k === 'page' || k === 'home' || !st[k] || (!always && now - st[k] > 10 * 60 * 1000)) return;
    if (extra.includes(k) || !c[k]) {

}

function demoReadMsgs(r) {

async function crLoad(rid, quiet) {
  const r = readById(rid); if (!r) return;
  if (CRX.id !== rid) { CRX.id = rid; CRX.msgs = []; CRX.likes = []; CRX.reveal = new Set(); CRX.err = ''; quiet = false; }
  if (r.demo || PREVIEW || !CLOUD || !sb) { const x = r.demo ? demoReadMsgs(r) : { msgs: [], likes: [] }; CRX.msgs = x.msgs; CRX.likes = x.likes; crPaint(); return; }
  if (!quiet) { CRX.loading = true; crPaint(); }
  const m = await sb.from('club_read_msgs').select('id,read_id,user_id,text,page,created_at,hidden_at').eq('read_id', rid).order('created_at', { ascending: true }).limit(500);
  CRX.loading = false;
  if (m.error) { CRX.err = "Couldn't load the discussion. Pull down to refresh, or check your connection."; crPaint(); return; }
  const ids = m.data.map(x => x.id);
  const l = ids.length ? await sb.from('club_read_likes').select('msg_id,user_id').in('msg_id', ids) : { data: [] };
  if (CRX.id !== rid) return;
  const before = JSON.stringify([CRX.msgs.map(x => x.id + (x.hidden ? 'h' : '')), CRX.likes.length]);
  CRX.msgs = m.data.map(x => ({ id: x.id, userId: x.user_id, text: x.text, page: x.page, createdAt: Date.parse(x.created_at), hidden: !!x.hidden_at }));
  CRX.likes = (l.data || []).map(x => ({ m: x.msg_id, u: x.user_id }));
  CRX.err = '';
  if (r.unread) { r.unread = 0; save(); }
  sb.from('club_read_seen').upsert({ read_id: rid, user_id: ME, seen_at: new Date().toISOString() }, { onConflict: 'read_id,user_id' }).then(() => {});
  if (!quiet || before !== JSON.stringify([CRX.msgs.map(x => x.id + (x.hidden ? 'h' : '')), CRX.likes.length])) crPaint();
}

  if (!s.q) {

/* ---------- doing things ---------- */
async function crRun(g, op, p = {}) {
  if (!CLOUD || !sb || PREVIEW) { toast(PREVIEW ? "Can't change club reads while previewing" : 'This needs an internet connection'); return null; }
  const { data, error } = await sb.rpc('club_read_manage', { p_club: g.id, p_op: op, p });
  if (error) { toast(/function|schema/i.test(error.message || '') ? 'Club reads need the latest Supabase update first' : error.message); return null; }
  return data || {};
}
/* put the club read book on my shelf (or reuse my copy) and make sure this club can see it */
function crShelfCopy(r, g) {
  let b = myCopy(r.title), added = false;
  if (!b) { b = addBook({ title: r.title, author: r.author, pages: r.pages, coverUrl: r.coverUrl, genre: r.genre, status: 'reading', from: 'Club read · ' + g.name }); added = true; }
  if (!b) return null;
  const patch = {};
  if (!added && (b.status === 'want' || b.status === 'paused')) patch.status = 'reading';
  if (!g.demo && Array.isArray(b.visibleTo) && !b.visibleTo.includes(g.id)) patch.visibleTo = [...b.visibleTo, g.id];
  if (Object.keys(patch).length) updBook(b.id, patch);
  return b;
}
async function crJoin(rid) {
  const r = readById(rid), g = r && db.groups.find(x => x.id === r.groupId); if (!r || !g) return;
  if (!r.demo && (!CLOUD || !sb || PREVIEW)) { toast(PREVIEW ? "Can't join while previewing" : 'This needs an internet connection'); return; }
  const b = crShelfCopy(r, g); if (!b) return;
  if (r.demo) { const key = g.demoKey, st = demoReadGet(key); st.joined = true; demoReadSet(key, st); }
  else {
    const { error } = await sb.from('club_read_members').upsert({ read_id: r.id, user_id: ME, book_id: b.id }, { onConflict: 'read_id,user_id' });
    if (error) { toast("Couldn't join: " + error.message); return; }
  }
  const X = crData(); X.members = X.members.filter(m => !(m.readId === r.id && m.userId === ME)); X.members.push({ readId: r.id, userId: ME, bookId: b.id, demo: !!r.demo });
  if (pushAskOK()) ui.crAskPush = r.id;
  save(); render(); toast(`📖 You're in! ${r.title} is on your shelf`);
}
async function crSend(rid) {
  const r = readById(rid), g = r && db.groups.find(x => x.id === r.groupId), ta = document.getElementById('cr-text'); if (!r || !g || !ta) return;
  const text = ta.value.trim(); if (!text) { ta.focus(); return; }
  if (r.endedAt) return;
  const c = langCheck(text);
  if (c === 'block') { toast("That has a word that isn't allowed on Shelfmates. Please edit it before sending."); ta.focus(); return; }
  if (c === 'strong' && !confirm('Heads up: this has a strong word, and your club will see it.\n\nOK to send anyway, or Cancel to edit.')) return;
  const spoil = document.getElementById('cr-spoil')?.checked, pg = parseInt(document.getElementById('cr-page')?.value, 10);
  const page = spoil && Number.isFinite(pg) ? Math.max(0, Math.min(100000, pg)) : null;
  let m;
  if (r.demo) {
    m = { id: 'mine_' + uid(), userId: ME, text, page, createdAt: Date.now() };
    const st = demoReadGet(g.demoKey); st.msgs = [...(st.msgs || []), { id: m.id, text, page, createdAt: m.createdAt }].slice(-50); demoReadSet(g.demoKey, st);
  } else {
    if (!CLOUD || !sb || PREVIEW) { toast(PREVIEW ? "Can't send while previewing" : 'This needs an internet connection'); return; }
    const btn = document.querySelector('[data-act="cr-send"]'); if (btn) btn.disabled = true;
    const { data, error } = await sb.from('club_read_msgs').insert({ read_id: r.id, user_id: ME, text, page }).select('id,created_at').single();
    if (btn) btn.disabled = false;
    if (error) { toast("Couldn't send: " + error.message); return; }
    m = { id: data.id, userId: ME, text, page, createdAt: Date.parse(data.created_at) || Date.now() };
  }
  if (CRX.id === r.id && !CRX.msgs.some(x => x.id === m.id)) CRX.msgs.push(m);
  r.msgs = (r.msgs || 0) + 1; ui.crDraft = ''; ui.crSpoil = false; ui.crPage = undefined; ta.value = ''; const sp = document.getElementById('cr-spoil'); if (sp) sp.checked = false;
  save(); crPaint();
  const last = document.querySelector('#cr-list .cr-msg:last-child'); if (last) last.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
async function crPickFor(d) {

function storyData(span) {

  const touched = new Set([...log.filter(l => l.pages > 0 || l.minutes > 0).map(l => l.bookId), ...finished.map(b => b.id)]);
  const myTitles = myBooks().filter(b => touched.has(b.id)).map(b => norm(b.title));
  const mates = new Set(myClubs().filter(g => !g.demo).flatMap(g => g.members));

    .forEach(b => { (along[b.userId] = along[b.userId] || new Set()).add(b.title); });
  return {
    label: span === 'year' ? String(y) : from.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }),
    pages: log.reduce((n, l) => n + (l.pages || 0), 0), mins: log.reduce((n, l) => n + (l.minutes || 0), 0),

}

function composeFormHTML() {
  const s = ui.share, solo = isSolo(), edit = s.editId && db.posts.find(p => p.id === s.editId);

  if (!edit && s.bookId && !options.find(b => b.id === s.bookId)) s.bookId = null;

  const formBody = `    ${edit ? `<div class="book-strip" style="margin-top:.2rem">${coverHTML(edit, 36, 54)}<div class="grow"><div class="item-title">${esc(edit.title)}</div><div class="meta">${esc(edit.author || '')}</div></div></div>` : `<div class="section-label">1 · The book</div>

    ${(() => { const b = s.bookId && myBooks().find(x => x.id === s.bookId); return b && b.status !== 'finished' ? `<label class="mrow static" style="border:1px solid var(--line);border-radius:var(--radius-md);margin-top:.6rem;cursor:pointer"><span class="mt">I finished this book<small>Leave off if you're still reading. Your thought is shared either way.</small></span><span class="switch"><input type="checkbox" id="share-finished" ${s.finished ? 'checked' : ''} data-share-fin="1"><span></span></span></label>` : ''; })()}
    <div class="section-label"><label for="thought">3 · What stayed with you? <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label></div>

`;
  return `${formBody}

const TOP_ACTS = /^(close|profile-save|name-save|fb-send|adm-save|create-save|club-edit-save|email-save|pass-save|post)$/;
function sheetHeader(sh) {

  const btns = [...last.querySelectorAll('button')], right = btns[btns.length - 1];
  if (!right || !TOP_ACTS.test(right.dataset.act || '') || btns.some(b => b !== right && /primary|accent/.test(b.className) && !b.classList.contains('danger'))) return;
  const left = btns.find(b => b !== right && !b.classList.contains('danger'));

  const h = [...sh.children].find(c => c.classList.contains('sheet-title'));
  const mid = document.createElement('div'); mid.className = 'sh-mid';
  if (h) { h.style.margin = '0'; mid.appendChild(h); }
  if (left) { left.className = 'sh-left'; let t = left.textContent.trim(); if (left.dataset.act === 'close' && t === 'Done') t = 'Close';
    if (/^(set-page|settings|adm-back)$/.test(left.dataset.act || '') && !t.startsWith('‹')) t = '‹ ' + t;

function suggestions() {
  const people = new Set(myClubs().flatMap(g => g.members).filter(id => id !== ME));
  const seen = new Set(), out = [];
  const justAdded = new Set((ui.sheetData.added || []).map(id => norm(db.books.find(x => x.id === id)?.title || '')));
  const push = (x, who) => { if (seen.has(norm(x.title)) || (onMyShelf(x.title) && !justAdded.has(norm(x.title)))) return; seen.add(norm(x.title)); out.push({ title: x.title, author: x.author, pages: x.pages, coverUrl: x.coverUrl, from: 'Saved from ' + who }); };
  db.books.filter(b => people.has(b.userId) && b.status === 'reading').forEach(b => push(b, userById(b.userId)?.name || 'a friend'));
  db.posts.filter(p => people.has(p.userId) && p.reaction !== 'down').forEach(p => push(p, userById(p.userId)?.name || 'a friend'));

}

function readSquare(file, size = 400) {
  return new Promise((resolve, reject) => {
    const r = new FileReader(); r.onerror = reject;
    r.onload = () => { const img = new Image(); img.onerror = reject; img.onload = () => {
      const s = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      resolve(c.toDataURL('image/jpeg', .8)); }; img.src = r.result; };
    r.readAsDataURL(file);
  });
}
function readPhoto(file, max = 900) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

let searchTimer, searchSeq = 0;
function queueSearch(q) {
  clearTimeout(searchTimer);
  ui.search.q = q;
  if (q.length < 2) { ui.search = { q, loading: false, results: [], error: '' }; renderResults(); return; }
  ui.search.loading = true; ui.search.error = ''; renderResults();
  searchTimer = setTimeout(() => searchBooks(q), 400);
}
async function searchBooks(q) {
  const seq = ++searchSeq;
  try {
    const url = 'https://openlibrary.org/search.json?limit=15&fields=title,author_name,number_of_pages_median,cover_i,subject&q=' + encodeURIComponent(q);
    const res = await fetch(url);
    if (!res.ok) throw new Error('bad');
    const data = await res.json();
    if (seq !== searchSeq) return;
    ui.search.results = (data.docs || []).map(d => ({
      title: d.title,
      author: (d.author_name || []).slice(0, 2).join(', '),
      pages: d.number_of_pages_median || 0,
      genre: genreFrom(d.subject, d.title),
      coverUrl: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : ''
    }));
    ui.search.error = ui.search.results.length ? '' : 'No matches. Try fewer words, or add it yourself.';
  } catch (e) {
    if (seq !== searchSeq) return;
    ui.search.error = "Couldn't reach the book search. Check your connection, or add it yourself.";
  }
  ui.search.loading = false;
  if (ui.sheet === 'add' || ui.sheet === 'cr-pick') renderResults();
}

}
/* change who sees a book; my thoughts about it follow */
function setBookVis(b, v, undoable = true) {

}
function updBook(id, patch) {

/* ---------- progress: slider + number box ---------- */
function syncProgress(id, raw, commit) {
  const b = db.books.find(x => x.id === id); if (!b) return;
  const max = progMax(b);
  let v = Math.round(+raw);
  if (!isFinite(v)) return;
  v = Math.max(0, Math.min(max, v));
  const tmp = Object.assign({}, b, b.pages ? { page: v } : { percent: v });
  document.querySelectorAll(`[data-prog-range="${id}"]`).forEach(el => { el.value = v; el.style.setProperty('--p', pct(tmp) + '%'); });
  document.querySelectorAll(`[data-prog-num="${id}"]`).forEach(el => { if (commit || el !== document.activeElement) el.value = v; });
  document.querySelectorAll(`[data-prog-label="${id}"]`).forEach(el => { el.textContent = progLabel(tmp); });
  if (!commit) return;
  const patch = b.pages ? { page: v } : { percent: v };
  if (b.pages) logPages(b, v - b.page);
  if (b.status === 'finished' && v < max) patch.status = 'reading';
  updBook(id, patch);
  const n = document.getElementById('today-num-s'); if (n) n.textContent = pagesOn(dayStr());
  if (patch.status) { render(); toast('Moved back to Reading now'); }
  else if (v === max && b.status === 'reading') toast('Last page! Tap “I finished it” when you’re done.');
}

  try {
    let { data: { session } } = await sb.auth.getSession();
    if (!session && PORTAL) { ui.loading = false; window.__pulled = true; render(); return; }   // the portal signs in with its own form
    if (!session) {
      const r = await sb.auth.signInAnonymously();
      if (r.error) throw r.error;
      session = r.data.session;
    }
    authUser = session.user; ME = authUser.id;
    try { localStorage.setItem('sm.lastUser', ME); } catch (e) {}
    sb.auth.onAuthStateChange((event, s) => {
      if (s && s.user && s.user.id !== ME) { location.reload(); return; }
      if (s && s.user) authUser = s.user;
    });
    db = load(); applyDemos();
    ui.loading = !db; render();
    loadDemoCfg(); loadAppCfg(); if (!PORTAL) demoLikeTick();
    await pull();
    if (PORTAL && authUser) { const { data: a } = await sb.rpc('am_i_admin'); isAdmin = !!a; }   // admin accounts may have no reading profile
    window.__pulled = true;
    ui.loading = false;
    if (db && pendingJoin) await joinByCode(pendingJoin);
    else render();
    const qs = new URLSearchParams(location.search), pvKind = qs.get('preview');
    const fromLink = !PORTAL && openFromLink(qs);
    if (!PORTAL) { countOpen(); if (fromLink || pvKind) dailyPending = false; else setTimeout(dailyAsk, 900); }
    if (pvKind && isAdmin && PREVIEWS[pvKind]) { try { history.replaceState(null, '', location.pathname); } catch (e) {} startPreview(pvKind); }
    if (!db && pendingJoin) {
      const { data } = await sb.rpc('club_preview', { p_code: pendingJoin });
      const row = Array.isArray(data) ? data[0] : data;
      const el = document.getElementById('invite-title');
      if (row && el) el.textContent = `You're invited to ${row.name} · ${row.members} ${row.members === 1 ? 'member' : 'members'}`;
      const pic = document.getElementById('invite-pic');
      if (row && row.photo_url && pic) pic.innerHTML = `<img src="${esc(row.photo_url)}" alt="" style="width:2.6rem;height:2.6rem;border-radius:var(--radius-md);object-fit:cover;display:block">`;
    }
  } catch (e) {
    console.error(e); window.__pulled = true;
    ui.loading = false; setSyncState('error');
    db = db || load(); applyDemos(); render();
    toast("Couldn't reach the server: " + ((e && (e.message || e.error_description)) || e));
  }
})();
</script>
</body>
</html>
